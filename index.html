<style>
/* Layout idea: one narrow column, one decision per screen; the workday itself (a sun crossing a track) is the progress bar. */
:root{
  --paper:#EAF0F4; --card:#FFFFFF; --ink:#10283A; --muted:#506475; --line:#CFDBE4;
  --accent:#F4B321; --accent-ink:#10283A; --good:#177A53; --bad:#B53D28; --soft:#DDE7EE;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1B27; --card:#162A3A; --ink:#EAF1F5; --muted:#9FB2C1; --line:#2A455C;
    --accent:#F4B321; --accent-ink:#10283A; --good:#56C898; --bad:#F2917A; --soft:#1E3649;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1B27; --card:#162A3A; --ink:#EAF1F5; --muted:#9FB2C1; --line:#2A455C;
  --accent:#F4B321; --accent-ink:#10283A; --good:#56C898; --bad:#F2917A; --soft:#1E3649;
  color-scheme:dark;
}
/* Guardian themes: teal for planning for a child, plum for planning for yourself */
:root[data-mode="guard"]{--paper:#E6F2EF;--soft:#D2E8E2;--line:#BCD9D1;--accent:#5CC6AE;--accent-ink:#0E2A26;--muted:#4C6661}
:root[data-mode="me"]{--paper:#EFEAF7;--soft:#E0D6F0;--line:#D0C2E8;--accent:#B79CF0;--accent-ink:#1F1236;--muted:#5F5475;--ink:#1F1A2E}
@media (prefers-color-scheme:dark){
 :root[data-mode="guard"]:not([data-theme="light"]){--paper:#0D1F1C;--card:#14302B;--soft:#1B3B35;--line:#25483F;--accent:#5CC6AE;--accent-ink:#0E2A26;--muted:#9CC0B8;--ink:#E8F4F1}
 :root[data-mode="me"]:not([data-theme="light"]){--paper:#18122A;--card:#241B3B;--soft:#2E2449;--line:#3D3160;--accent:#B79CF0;--accent-ink:#1F1236;--muted:#B5A9CF;--ink:#F0ECF8}
}
:root[data-theme="dark"][data-mode="guard"]{--paper:#0D1F1C;--card:#14302B;--soft:#1B3B35;--line:#25483F;--accent:#5CC6AE;--accent-ink:#0E2A26;--muted:#9CC0B8;--ink:#E8F4F1}
:root[data-theme="dark"][data-mode="me"]{--paper:#18122A;--card:#241B3B;--soft:#2E2449;--line:#3D3160;--accent:#B79CF0;--accent-ink:#1F1236;--muted:#B5A9CF;--ink:#F0ECF8}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}

.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 16px 32px}
.top{display:flex;align-items:center;gap:8px;padding:14px 0;flex-wrap:wrap}

body{position:relative}

.track{position:relative;height:28px;margin:2px 14px}
.track::before{content:"";position:absolute;left:0;right:0;top:13px;height:3px;background:var(--line);border-radius:2px}
.track i{position:absolute;top:8px;width:13px;height:13px;border-radius:50%;background:var(--line);transform:translateX(-50%)}
.track i.done{background:var(--ink)}
.track b{position:absolute;top:2px;width:25px;height:25px;border-radius:50%;background:var(--accent);border:3px solid var(--ink);transform:translateX(-50%);transition:left .4s ease}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.bubble::before,.bubble::after{content:"";position:absolute;background:var(--card);border:2px solid var(--line);border-radius:50%}
.bubble::before{width:14px;height:14px;top:-12px;left:34px}
.bubble::after{width:8px;height:8px;top:-22px;left:46px}
.bubble.up{border-color:var(--good)} .bubble.down{border-color:var(--bad)}
.vote{display:flex;gap:8px}
.vote button{flex:1;background:transparent;border:2px solid var(--line);border-radius:999px;padding:8px 10px;font-size:16px;min-height:44px}

.tag{font-size:13px;color:var(--muted)}
ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.steps{list-style:none;padding:0;gap:10px}
.steps li{border-left:4px solid var(--accent);padding-left:12px}
.steps.numbered{counter-reset:n;gap:14px}
.steps.numbered li{counter-increment:n;position:relative;padding-left:52px;border-left:0}
.steps.numbered li::before{content:counter(n);position:absolute;left:0;top:0;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center}
.steps.numbered strong{font-weight:700;white-space:nowrap}
.steps.numbered li b{text-transform:none;letter-spacing:0;font-size:18px;color:var(--ink)}
.steps.numbered li > b:first-child{margin-bottom:2px}
.steps b{display:block;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.note{border-left:4px solid var(--accent);padding:8px 12px;background:var(--soft);border-radius:0 10px 10px 0;font-size:16px}
.plantitle{font-size:clamp(32px,8vw,46px)}
.toc h3{font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}

.toc a:hover{text-decoration-color:var(--ink)}
.plans{display:flex;flex-direction:column;gap:12px;padding-top:22px;border-top:2px solid var(--line)}
.planh{display:flex;align-items:center;gap:12px;font-size:28px;scroll-margin-top:16px}
.planh span{flex:none;width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:20px}
.plantitle{scroll-margin-top:16px}
.jobh{font-size:20px;font-weight:800}
.totop{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:#10283A;color:#F4B321;font-weight:800;font-size:16px;text-decoration:none;padding:10px 18px;border-radius:999px;border:2px solid #F4B321;min-height:44px}
.totop::before{content:"\2191"}
.totop:hover{background:#F4B321;color:#10283A}
.totop:focus-visible{outline:3px solid #10283A;outline-offset:3px}
.modebar{flex-basis:100%;display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:4px 6px 4px 14px;font-weight:700;font-size:15px}
.modebar .link{color:var(--accent-ink);padding:4px 8px;min-height:36px}
.modebar span{margin-right:auto}
.ghost.on{border-color:var(--ink);font-weight:700}
.row.wrap{flex-wrap:wrap}
.kidform{max-height:calc(100vh - 32px);overflow:auto}
.kidform .row button{white-space:nowrap}
.kidform input{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;min-height:52px}
.gatecard{border:2px dashed var(--line)}
.opt.wide{padding:20px}
.opt.wide b{font-size:21px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--soft);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stats b{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.stats span{font-size:13px;color:var(--muted)}
.stats .statwide{grid-column:1/-1}
.assignlinks{flex-direction:column;align-items:flex-start;gap:0}
.stats:has(.statwide){grid-template-columns:1fr 1fr}
.backtop{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.stats b em{font-family:var(--body,inherit);font-style:normal;font-weight:400;font-size:13px;color:var(--muted);letter-spacing:0}
.glance{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.glance li{border-left:4px solid var(--accent);padding-left:12px;display:flex;flex-direction:column}
.glance span{font-size:16px;color:var(--muted)}
.search{display:flex;flex-direction:column;gap:6px}
.search label{font-weight:700}
.search input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;min-height:52px}
.search .row{flex-wrap:nowrap}
.chipbtn{border:0;cursor:pointer;min-height:40px;padding:6px 14px}
.chipbtn:hover{background:var(--accent);color:var(--accent-ink)}
.link.strong{font-weight:700}
.gradebox{display:flex;flex-direction:column;gap:6px}
.gradelbl{font-weight:700}
.btnlink{display:inline-flex;align-items:center;text-decoration:none}
a.ghost.btnlink{border:2px solid var(--line);border-radius:999px;padding:8px 14px;min-height:44px;color:var(--ink)}
.emailbox{border:2px solid var(--accent)}
:root[data-mode="teach"]{--paper:#FBF0E9;--soft:#F4DFD3;--line:#EACABB;--accent:#EE9466;--accent-ink:#2E1408;--muted:#6E5146}
@media (prefers-color-scheme:dark){:root[data-mode="teach"]:not([data-theme="light"]){--paper:#22150F;--card:#2E1E16;--soft:#3A271D;--line:#4C3326;--accent:#EE9466;--accent-ink:#2E1408;--muted:#C9AE9F;--ink:#F7ECE6}}
:root[data-theme="dark"][data-mode="teach"]{--paper:#22150F;--card:#2E1E16;--soft:#3A271D;--line:#4C3326;--accent:#EE9466;--accent-ink:#2E1408;--muted:#C9AE9F;--ink:#F7ECE6}
.opts.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

 day:[["8:00 AM","Plan the day",[["Decide which customers to visit","plan"],["Check your sales numbers against your goal","math"],["Answer emails from buyers","write"]]],
 ["10:00 AM","Customer visit",[["Drive to a customer's business","travel"],["Show a store manager a new product","people"],["Listen for what they actually need","people"]]],
 ["1:30 PM","The deal",[["Negotiate price and delivery","people"],["Hear no and keep going","rush"],["Work out a discount that still makes money","math"]]],
 ["4:00 PM","Follow up",[["Enter orders on the computer","tech"],["Call a business that has never heard of you","people"],["Earn more in months when you sell more","rush"]]]],
 skills:["Listening","Persuading","Handling rejection","Staying organized"],
 steps:["Get a job with customers: retail, food service, anything. Join a business or debate club.","Decide whether to apply for entry sales jobs or to a business program first.","Start in an entry sales or customer service role and move up as you hit your numbers."],
 apply:"Pay swings widely. People who sell technical and scientific products typically earn about $105,000."},
{id:"wind",name:"Wind turbine technician",pay:64000,yr:2025,paths:["short"],pathText:"Technical school certificate, often under 2 years, plus on-the-job training.",env:["out","hands","travel"],set:"wind",hat:"#FFFFFF",shirt:"#D2691E",
 blurb:"You keep wind turbines running. You climb hundreds of feet and fix mechanical and electrical parts at the top.",
 day:[["6:30 AM","Drive out",[["Drive to the wind farm","travel"],["Check the weather: too much wind means no climb","plan"],["Go over the safety plan with your partner","team"]]],
 ["8:00 AM","The climb",[["Climb a ladder more than 250 feet up inside the tower","high"],["Stay clipped into a harness the whole time","detail"],["Carry your tools up with you","move"]]],
 ["12:00 PM","Up top",[["Work in a small room at the top with a huge view","out"],["Replace a worn part in the gearbox","hands"],["Test the electrical system to find a fault","fix"]]],
 ["3:00 PM","Back down",[["Check the turbine's data on a laptop","tech"],["Log the repair","write"],["Travel to other wind farms, sometimes for weeks","travel"]]]],
 skills:["Comfort with heights","Mechanical and electrical basics","Fitness","Safety focus"],
 steps:["Take physics and any shop or electronics class. Stay fit.","Look for wind energy technology programs at community and technical colleges.","Finish the certificate, then train on the job with an experienced technician."],
 apply:"Most jobs are in windy, rural areas. Think about whether you would move for the work."},
{id:"social",name:"Social worker",pay:62000,yr:2025,paths:["college"],pathText:"Bachelor's degree in social work. Counseling jobs need a master's degree and a license.",env:["people","travel"],set:"office",sets:["office","house","office","office"],shirt:"#4E8A6B",
 blurb:"You help children, families and adults get through hard times and find the services they need.",
 day:[["8:30 AM","Case review",[["Review your cases for the day","plan"],["Call a school about a student who needs help","people"],["Work at a desk for part of the day","desk"]]],
 ["10:30 AM","Home visit",[["Drive to visit a family at home","travel"],["Listen to a parent who is struggling","care"],["Connect them with food and housing help","fix"]]],
 ["1:30 PM","A hard moment",[["Respond when a child may not be safe","rush"],["Work with police, doctors and teachers","team"],["Stay steady when things get emotional","care"]]],
 ["4:00 PM","Follow through",[["Write careful case notes","write"],["Speak up for a client in a meeting","lead"],["Carry many cases at once","plan"]]]],
 skills:["Listening","Empathy with limits","Writing","Knowing community resources"],
 steps:["Volunteer with a community group. Take psychology or sociology if offered.","Apply to colleges with social work programs. Fill out the FAFSA.","Earn the degree. Decide later whether to add a master's for counseling work."],
 apply:"Honest note: pay is lower than many jobs that need the same schooling. People choose it for the work itself."},
{id:"acct",name:"Accountant",pay:84000,yr:2025,paths:["college"],pathText:"Bachelor's degree in accounting. Many go on to earn a CPA license.",env:["desk"],set:"office",shirt:"#52708F",
 blurb:"You keep track of money for businesses and people, and make sure the numbers are right. Every kind of company needs one.",
 day:[["8:30 AM","Open the books",[["Open a client's records for the month","detail"],["Enter and check numbers in accounting software","tech"],["Sit at a desk most of the day","desk"]]],
 ["10:30 AM","Something is off",[["Find out why the totals don't match","fix"],["Trace a missing payment line by line","detail"],["Do the math twice","math"]]],
 ["1:30 PM","Client meeting",[["Explain a tax bill to a small-business owner","people"],["Suggest ways to save money","plan"],["Answer questions in plain words","people"]]],
 ["4:00 PM","Deadline",[["Finish a tax return before it is due","rush"],["Write a summary for your manager","write"],["Work long hours during tax season","rush"]]]],
 skills:["Comfort with numbers","Accuracy","Spreadsheets","Explaining money clearly"],
 steps:["Take an accounting or business class if offered. Learn spreadsheets.","Apply to colleges with accounting programs. Fill out the FAFSA.","Earn the degree. Decide whether to go for the CPA license, which needs extra credits and an exam."],
 apply:"Community colleges offer accounting courses that transfer, which can cut the cost of the first two years."},
{id:"plumb",name:"Plumber",pay:64000,yr:2025,paths:["earn"],pathText:"Paid apprenticeship, usually 4 to 5 years, then a state license.",env:["hands","travel","move"],set:"house",sets:["house","house","site","house"],hat:"#3F78B5",shirt:"#6B7F3A",
 blurb:"You install and repair the pipes that bring water and gas into buildings and carry waste out. You learn while getting paid.",
 day:[["7:30 AM","Load the truck",[["Load pipe and fittings","move"],["Drive to the first job","travel"],["Read the plans for a new bathroom","detail"]]],
 ["9:00 AM","A hidden leak",[["Find a leak behind a wall","fix"],["Work in a cramped space under a sink","move"],["Explain the fix and the price to the homeowner","people"]]],
 ["1:00 PM","New building",[["Cut and join pipe","hands"],["Measure angles so water drains the right way","math"],["Work alongside electricians and carpenters","team"]]],
 ["3:30 PM","Test it",[["Test the system under pressure","fix"],["Make sure the work meets code","detail"],["Take emergency calls some nights","rush"]]]],
 skills:["Mechanical sense","Math with measurements","Problem-solving","Customer service"],
 steps:["Take algebra and geometry. Take shop or a career-tech class if you can.","Look up plumbing apprenticeships near you, union and non-union.","Graduate, apply, and start paid training with classes on the side."],
 apply:"Pay starts lower and rises each year of the apprenticeship. Many plumbers later run their own business."},
{id:"auto",name:"Auto mechanic",pay:51000,yr:2025,paths:["short"],pathText:"Certificate or associate degree in automotive technology, 6 months to 2 years.",env:["hands","move"],set:"garage",shirt:"#3D4F63",
 blurb:"You find out what is wrong with cars and trucks and fix them. Cars are now part machine and part computer.",
 day:[["8:00 AM","First car",[["Read the work order: car won't start","detail"],["Ask the customer what they noticed","people"],["Stand on a concrete floor all day","move"]]],
 ["9:30 AM","Diagnose",[["Plug in a scanner to read the car's computer","tech"],["Test parts to find the real cause","fix"],["Get your hands greasy","hands"]]],
 ["1:00 PM","Repair",[["Replace brakes with hand and power tools","hands"],["Lift heavy parts","move"],["Race the clock: many shops pay by the job","rush"]]],
 ["4:00 PM","Finish",[["Test drive to check the repair","fix"],["Write what you did on the invoice","write"],["Keep learning as cars change","detail"]]]],
 skills:["Troubleshooting","Hand tools","Electronics basics","Patience"],
 steps:["Take auto shop if your school has it. Work on a car, a bike, anything with an engine.","Compare automotive programs at community colleges. Some are sponsored by car makers.","Finish the program and earn industry certifications as you work."],
 apply:"Honest note: pay is on the low side to start. Diesel mechanics, who work on trucks and buses, typically earn about $62,000."},
{id:"carp",name:"Carpenter",pay:61000,yr:2025,paths:["earn"],pathText:"Paid apprenticeship, or start as a helper and learn on the job.",env:["hands","out","move"],set:"site",hat:"#F4B321",shirt:"#8A5A32",
 blurb:"You build the frames, floors, stairs and roofs of houses and buildings. At the end of the day you can see what you made.",
 day:[["6:30 AM","Set up",[["Unload lumber at the job site","move"],["Read the blueprint for today's framing","detail"],["Work outside in most weather","out"]]],
 ["8:30 AM","Framing",[["Measure, cut and nail wall frames","hands"],["Do quick math with fractions and angles","math"],["Lift walls into place with your crew","team"]]],
 ["12:30 PM","Up high",[["Set roof beams from a ladder or scaffold","high"],["Use saws and nail guns safely","detail"],["Keep moving all day","move"]]],
 ["3:00 PM","Finish",[["Fix a wall that is not square","fix"],["Look at what you built today","hands"],["Clean up the site","move"]]]],
 skills:["Measuring and fractions","Strength and stamina","Reading plans","Care with tools"],
 steps:["Take geometry and wood shop. Build something.","Look up carpentry apprenticeships, or ask local builders about summer helper jobs.","Graduate and start as an apprentice or helper."],
 apply:"Carpenters who learn to read plans and lead crews can move up to construction manager, one of the best-paid jobs here."},
{id:"emt",name:"Paramedic",pay:48000,yr:2025,paths:["short"],pathText:"EMT course of a few months to start. Paramedic training takes 1 to 2 years more.",env:["move","travel","people"],set:"street",veh:"amb",shirt:"#22384A",
 blurb:"You are the first medical help to reach people in an emergency. You treat them on the spot and on the way to the hospital.",
 day:[["7:00 AM","Shift start",[["Check the ambulance and restock supplies","detail"],["Start a 12-hour shift with your partner","team"],["Never know what the next call will be","rush"]]],
 ["9:30 AM","A call",[["Drive with lights and sirens","rush"],["Work out what happened in seconds","fix"],["Treat a patient on their kitchen floor","care"]]],
 ["1:00 PM","Transport",[["Lift a patient on a stretcher","move"],["Keep them stable on the way to the hospital","care"],["Report to the emergency room nurse","people"]]],
 ["4:30 PM","Late shift",[["Calm a frightened child","care"],["Write a report for every call","write"],["Work nights, weekends and holidays","rush"]]]],
 skills:["Staying calm","First aid and anatomy","Quick decisions","Physical strength"],
 steps:["Take biology and a CPR class. Ask a local ambulance service about a ride-along.","Find an EMT course at a community college. Some let you start at 18.","Earn EMT certification and work, then add paramedic training if you want more."],
 apply:"Honest note: the pay is low for how hard the work is. Many people use it as a first step toward nursing, firefighting or physician assistant."},
{id:"lpn",name:"Licensed practical nurse",pay:64000,yr:2025,paths:["short"],pathText:"Practical nursing program of about 1 year, then a license exam.",env:["people","move"],set:"clinic",shirt:"#A0527A",
 blurb:"You give basic nursing care in nursing homes, clinics and hospitals. It is one of the quickest ways into health care.",
 day:[["7:00 AM","Shift start",[["Get your patient list","team"],["Check each patient's vital signs","care"],["Be on your feet all shift","move"]]],
 ["9:30 AM","Morning care",[["Give medicines on schedule","detail"],["Change a bandage","hands"],["Chat with a resident who is lonely","people"]]],
 ["1:00 PM","Afternoon",[["Notice a patient seems worse and tell the registered nurse","fix"],["Help someone eat and bathe","care"],["Lift and move patients safely","move"]]],
 ["3:30 PM","Hand off",[["Chart everything you did","write"],["Explain care to a family","people"],["Brief the next shift","team"]]]],
 skills:["Compassion","Careful routines","Biology basics","Physical stamina"],
 steps:["Take biology. Volunteer at a nursing home to see if you like the work.","Apply to practical nursing programs at community or technical colleges.","Finish the program and pass the license exam."],
 apply:"Many practical nurses later take a bridge program to become registered nurses, who typically earn about $98,000."},
{id:"pt",name:"Physical therapist",pay:103000,yr:2025,paths:["college"],wait:7,chip:"College plus graduate school",pathText:"Bachelor's degree, then a 3-year Doctor of Physical Therapy program and a license. About 7 years in all.",env:["people","move"],set:"gym",shirt:"#2F7F86",
 blurb:"You help people move again after an injury, surgery or illness. You are active and working with people all day.",
 day:[["8:00 AM","Prepare",[["Read a new patient's injury history","detail"],["Plan the day's sessions","plan"],["Be active and on your feet","move"]]],
 ["9:30 AM","Evaluation",[["Test how far a knee bends after surgery","fix"],["Design an exercise plan for that person","plan"],["Explain the plan so they believe in it","people"]]],
 ["1:00 PM","Treatment",[["Guide a patient through exercises","care"],["Use your hands to stretch tight muscles","hands"],["Encourage someone who wants to quit","lead"]]],
 ["4:00 PM","Progress",[["Record each patient's progress","write"],["Celebrate when someone walks without a cane","care"],["See ten or more patients a day","people"]]]],
 skills:["Anatomy","Encouraging people","Problem-solving","Stamina"],
 steps:["Take biology, anatomy and physics. Ask to observe at a physical therapy clinic.","Apply to colleges. Any major works if you take the required science classes.","Earn a bachelor's degree, then apply to Doctor of Physical Therapy programs."],
 apply:"Want a shorter route? Physical therapist assistants do hands-on treatment with a 2-year degree."},
{id:"pa",name:"Physician assistant",pay:136000,yr:2025,paths:["college"],wait:7,chip:"College plus graduate school",pathText:"Bachelor's degree, patient-care experience, then a master's program of 2 to 3 years and a license.",env:["people","move"],set:"clinic",shirt:"#F5F8FA",
 blurb:"You examine patients, diagnose illness and prescribe medicine, working with a doctor. It takes fewer years than medical school.",
 day:[["8:00 AM","Morning huddle",[["Go over today's patients with the doctor","team"],["Read lab results","detail"],["Move from room to room all day","move"]]],
 ["9:30 AM","Exam",[["Examine a patient and ask about symptoms","care"],["Figure out what is wrong","fix"],["Explain the diagnosis clearly","people"]]],
 ["1:00 PM","Procedure",[["Stitch up a deep cut","hands"],["Order tests and prescribe medicine","plan"],["Decide quickly when it is urgent","rush"]]],
 ["4:00 PM","Wrap up",[["Write notes on every patient","write"],["Call a patient with results","people"],["Keep studying, because medicine changes","detail"]]]],
 skills:["Strong science","Listening","Decision-making","Lifelong studying"],
 steps:["Take biology, chemistry and the hardest math you can.","Apply to colleges and plan a science-heavy schedule. Fill out the FAFSA.","During college, get patient-care hours (EMT and nursing assistant jobs count), then apply to PA programs."],
 apply:"PA programs are competitive and expect real patient-care experience before you apply."},
{id:"vet",name:"Veterinary technician",pay:47000,yr:2025,paths:["short"],pathText:"Associate degree in veterinary technology, then a credential exam.",env:["hands","people","move"],set:"vet",shirt:"#4E8A6B",
 blurb:"You are the nurse of the animal hospital. You help the veterinarian with exams, lab work and surgery.",
 day:[["7:30 AM","Morning rounds",[["Feed and check animals that stayed overnight","animal"],["Set up the exam rooms","plan"],["Be on your feet all day","move"]]],
 ["9:00 AM","Exams",[["Hold a nervous dog still for the vet","animal"],["Draw blood and run lab tests","detail"],["Talk an owner through care at home","people"]]],
 ["12:30 PM","Surgery",[["Prepare an animal for surgery","detail"],["Watch its breathing and heart rate","care"],["Help the vet in an emergency","rush"]]],
 ["3:30 PM","Afternoon",[["Take X-rays of a limping cat","tech"],["Clean cages and tools","hands"],["Comfort an owner on a very sad day","people"]]]],
 skills:["Calm with animals","Biology","Careful lab work","Kindness with owners"],
 steps:["Take biology. Volunteer at an animal shelter or a vet's office.","Apply to accredited veterinary technology programs.","Finish the degree and pass the credential exam."],
 apply:"Honest note: the pay is low. Veterinarians typically earn about $130,000, and that path takes about 8 years of college."},
{id:"web",name:"Web and digital designer",pay:100000,yr:2025,paths:["college"],pathText:"Often a bachelor's degree. A strong portfolio of real work matters a lot.",env:["desk"],set:"office",shirt:"#C2587A",
 blurb:"You design and build websites and apps that are easy to use. It mixes art with code.",
 day:[["9:00 AM","Kickoff",[["Meet the team about a new website","team"],["Sketch how each page should work","plan"],["Sit at a screen most of the day","desk"]]],
 ["10:30 AM","Build",[["Write code that makes the page work","tech"],["Choose layout, color and type","detail"],["Test it on a phone and a laptop","fix"]]],
 ["2:00 PM","Feedback",[["Watch a real person try your site and get lost","people"],["Fix what tripped them up","fix"],["Balance what looks good with what works","plan"]]],
 ["4:00 PM","Launch",[["Push the update live","rush"],["Write notes for the next developer","write"],["Often work from home","desk"]]]],
 skills:["Design sense","HTML, CSS and JavaScript","Listening to users","Attention to detail"],
 steps:["Take art and computer classes. Build a simple website with free tools.","Build a portfolio of 3 to 5 projects. Apply to design or computer programs.","Earn the degree or build your skills and portfolio, and look for internships."],
 apply:"If you like graphic design, look here too. The skills overlap and the pay is much higher."},
{id:"data",name:"Data scientist",pay:120000,yr:2025,paths:["college"],pathText:"Bachelor's degree in math, statistics or computer science. Many have a master's degree.",env:["desk"],set:"office",shirt:"#4A5FA5",
 blurb:"You dig through huge amounts of information to answer questions and predict what will happen next.",
 day:[["9:00 AM","The question",[["Get a question: why are customers leaving?","plan"],["Pull the data you need","tech"],["Work at a computer all day","desk"]]],
 ["10:30 AM","Clean up",[["Fix messy, missing data","detail"],["Write code to sort millions of rows","tech"],["Use statistics","math"]]],
 ["2:00 PM","Find it",[["Spot a pattern nobody noticed","fix"],["Build a model that predicts what happens next","math"],["Check that you are not fooling yourself","detail"]]],
 ["4:00 PM","Explain",[["Turn your findings into a clear chart","tech"],["Present to people who don't like math","people"],["Write up what the company should do","write"]]]],
 skills:["Statistics","Coding","Curiosity","Explaining clearly"],
 steps:["Take statistics and the most math you can. Try a free intro to Python.","Apply to colleges with statistics, math, data science or computer science. Fill out the FAFSA.","Earn the degree and do projects with real data. Consider a master's later."],
 apply:"A school project where you collected and analyzed real data is a good thing to write about on applications."},
{id:"hr",name:"Human resources specialist",pay:76000,yr:2025,paths:["college"],pathText:"Bachelor's degree in human resources, business or a related field.",env:["people","desk"],set:"office",shirt:"#9A6A3A",
 blurb:"You hire people, help them settle in, and sort out problems at work. You are the link between workers and the company.",
 day:[["8:30 AM","Applications",[["Read applications for an open job","detail"],["Schedule interviews","plan"],["Split your time between a desk and meetings","desk"]]],
 ["10:00 AM","Interview",[["Interview a job candidate","people"],["Decide who fits the team","lead"],["Call someone with a job offer","people"]]],
 ["1:30 PM","A problem",[["Listen to an employee with a complaint","care"],["Sort out a conflict fairly","fix"],["Keep private things private","detail"]]],
 ["3:30 PM","New hire",[["Welcome a new employee and explain benefits","people"],["Update employee records","tech"],["Write a job posting","write"]]]],
 skills:["Listening","Fairness","Organization","Clear writing"],
 steps:["Take business or psychology classes. Any job where you train or schedule others helps.","Apply to colleges with business or human resources programs. Fill out the FAFSA.","Earn the degree. Internships in an HR office are the usual way in."],
 apply:"You will also learn how hiring works from the inside, which helps in any career."},
{id:"fa",name:"Flight attendant",pay:64000,yr:2025,paths:["earn"],pathText:"High school diploma, then paid airline training of several weeks and FAA certification.",env:["people","travel","move"],set:"cabin",shirt:"#2E4A7A",
 blurb:"You keep airline passengers safe and comfortable. Your office is a plane, and you may wake up in a different country.",
 day:[["5:30 AM","Report for duty",[["Review the flight's safety plan with the crew","team"],["Check emergency equipment before boarding","detail"],["Start the day in one city and end it in another","travel"]]],
 ["8:00 AM","Boarding",[["Greet 180 passengers","people"],["Give the safety demonstration","lead"],["Be on your feet in a narrow aisle","move"]]],
 ["12:00 PM","In the air",[["Serve drinks and meals","people"],["Calm a passenger who is afraid of flying","care"],["Handle a medical emergency at 35,000 feet","rush"]]],
 ["6:00 PM","Landing abroad",[["Land in another country and stay overnight","world"],["Use a second language with passengers","world"],["Be away from home several nights a week","travel"]]]],
 skills:["Customer service","Staying calm","First aid","A second language helps"],
 steps:["Get a job serving customers. Keep studying a second language.","Check airline requirements: most want you to be 18 to 21, with a diploma and customer service experience.","Apply to airlines. If hired, you train for several weeks before your first flight."],
 apply:"Speaking a second language helps you get international routes. New flight attendants often get the least popular schedules."},
{id:"pilot",name:"Airline pilot",pay:232000,yr:2025,paths:["college"],wait:6,chip:"College plus flight training",pathText:"Flight training and FAA licenses, then 1,500 flight hours before airlines hire you. Most airline pilots have a bachelor's degree.",env:["travel"],set:"cockpit",sets:["hangar","cockpit","cockpit","cockpit"],shirt:"#F5F8FA",
 blurb:"You fly passengers or cargo across the country and around the world. It is one of the highest-paid jobs you can get without a graduate degree.",
 day:[["6:00 AM","Preflight",[["Check the weather and the flight plan","plan"],["Walk around the plane to inspect it","detail"],["Brief the crew","lead"]]],
 ["8:00 AM","Takeoff",[["Take off with 180 people on board","rush"],["Work the controls and instruments","tech"],["Talk with air traffic control","team"]]],
 ["11:00 AM","Cruise",[["Monitor the plane's systems for hours","detail"],["Reroute around a storm","fix"],["Sit in a small cockpit for a long time","desk"]]],
 ["3:00 PM","Landing",[["Land in another country","world"],["Stay in hotels away from home","travel"],["Work an irregular schedule","rush"]]]],
 skills:["Math and physics","Calm decision-making","Attention to detail","Good health and vision"],
 steps:["Take physics and math. Ask a local airport about a discovery flight to see if you love it.","Compare routes: college aviation programs, flight schools, airline cadet programs, or military flying.","Earn your licenses step by step, then build flight hours, often as a flight instructor."],
 apply:"Flight training is expensive, so ask every program about cost and aid. Commercial pilots who fly charters, cargo and tours typically earn about $123,000."},
{id:"ship",name:"Ship's officer",pay:72000,yr:2025,paths:["earn","college"],pathText:"Start as a deckhand with Coast Guard credentials and work up, or attend a 4-year maritime academy.",env:["out","travel","move"],set:"ship",hat:"#FFFFFF",shirt:"#22384A",
 blurb:"You help run cargo ships, ferries or tugboats. On ocean-going ships you work for weeks at sea, then get weeks off.",
 day:[["6:00 AM","On watch",[["Stand watch on the bridge of a cargo ship","detail"],["Steer by radar, charts and GPS","tech"],["Be out on open water","out"]]],
 ["10:00 AM","Deck work",[["Inspect cargo and lines on deck","move"],["Repair equipment with the crew","hands"],["Work in wind, sun and rain","out"]]],
 ["2:00 PM","Foreign port",[["Guide the ship into a port in another country","world"],["Work with dock crews who speak other languages","world"],["Supervise loading thousands of containers","lead"]]],
 ["8:00 PM","Life aboard",[["Live on the ship for weeks or months","travel"],["Then get weeks off at home","plan"],["Run safety drills with the crew","team"]]]],
 skills:["Navigation","Mechanical sense","Teamwork in close quarters","Being okay away from home"],
 steps:["Take math and physics. Learn to swim well. Look into Sea Scouts or a maritime high school program.","Compare the two routes: a state or federal maritime academy, or entry-level deck jobs.","Get your Coast Guard credentials and start building sea time."],
 apply:"The pay figure covers all water transportation workers. Captains and officers on large ships earn much more."},
{id:"interp",name:"Interpreter or translator",pay:60000,yr:2025,paths:["college"],pathText:"Fluency in two languages. A bachelor's degree is typical, and certification helps for medical and court work.",env:["people","desk"],set:"office",sets:["office","clinic","class","office"],shirt:"#A0527A",
 blurb:"You help people who speak different languages understand each other, in writing or out loud, in hospitals, courts, schools and businesses.",
 day:[["8:30 AM","Translate",[["Translate a document from Spanish into English","world"],["Find the exact word, not just a close one","detail"],["Work at a computer with translation software","tech"]]],
 ["10:30 AM","At a hospital",[["Interpret between a doctor and a patient's family","care"],["Switch between two languages in real time","world"],["Stay neutral and accurate","detail"]]],
 ["1:30 PM","At a school",[["Interpret at a parent-teacher meeting","people"],["Think fast with no time to look anything up","rush"],["Drive to a different place for each job","travel"]]],
 ["4:00 PM","Prepare",[["Study the terms for tomorrow's job","plan"],["If you freelance, find your own clients","people"],["Write up an invoice","write"]]]],
 skills:["Two languages at a high level","Listening","Cultural knowledge","Fast thinking"],
 steps:["Keep building both languages, including reading and writing. Take the highest language classes you can.","Apply to colleges. Any major works if your languages are strong. Ask about a seal of biliteracy on your diploma.","Earn the degree and look into medical or court interpreter certification."],
 apply:"If you speak another language at home, you have a head start. Honest note: job growth is slow because software now does routine translation. Medical and court interpreting still need people."},
{id:"surv",name:"Land surveyor",pay:75000,yr:2025,paths:["college"],pathText:"Bachelor's degree, then a state license after supervised work experience.",env:["out","move","travel"],set:"field",prop:"tripod",hat:"#F4B321",shirt:"#D9822B",
 blurb:"You measure land to mark exactly where property lines, roads and buildings go. Nothing gets built until a surveyor has been there.",
 day:[["7:00 AM","Research",[["Study old property records and maps","detail"],["Load GPS gear into the truck","move"],["Drive to today's site","travel"]]],
 ["9:00 AM","In the field",[["Set up a tripod and measure the land","tech"],["Hike over rough ground","out"],["Mark the exact property corners","detail"]]],
 ["1:00 PM","Drone flight",[["Fly a drone to map a construction site","tech"],["Do the trigonometry","math"],["Work with a small crew","team"]]],
 ["3:30 PM","Back at the office",[["Turn your measurements into a map on a computer","desk"],["Sign a legal document saying where the line is","write"],["Explain a boundary to two neighbors","people"]]]],
 skills:["Geometry and trigonometry","Precision","Comfort outdoors","Mapping software"],
 steps:["Take geometry, trigonometry and any drafting or computer mapping class.","Apply to colleges with surveying, geomatics or civil engineering programs.","Earn the degree, work under a licensed surveyor, then take the licensing exams."],
 apply:"Many surveyors are close to retiring, and few students know the job exists."},
{id:"cost",name:"Cost estimator",pay:79000,yr:2025,paths:["college"],pathText:"Bachelor's degree is typical. Some estimators move up from the construction trades.",env:["desk"],set:"office",sets:["office","site","office","office"],hat:"#FFFFFF",shirt:"#52708F",
 blurb:"You work out what a project will cost before anyone builds it. If your number is right, your company wins the job and makes money.",
 day:[["8:30 AM","Blueprints",[["Study the blueprints for a new school","detail"],["Count every wall, window and pipe","detail"],["Work at a desk with big screens","desk"]]],

{id:"rad",name:"Radiation therapist",pay:105000,yr:2025,paths:["short"],pathText:"Associate degree in radiation therapy, then certification and usually a state license.",env:["people","desk"],set:"scan",shirt:"#3B8E72",

 ["9:30 AM","First patient",[["Position a patient to the millimeter","detail"],["Explain what will happen and answer questions","people"],["Help a weak patient onto the table","care"]]],

{id:"ota",name:"Occupational therapy assistant",pay:71000,yr:2025,paths:["short"],pathText:"Associate degree from an accredited program, then a license.",env:["people","move","hands"],set:"gym",shirt:"#C06A3A",
 blurb:"You help people relearn everyday tasks after an injury or illness, and help kids build skills for school.",
 day:[["8:00 AM","Plan the day",[["Go over today's patients with the occupational therapist","team"],["Set up equipment and activities","plan"],["Be on your feet and moving","move"]]],
 ["9:30 AM","Rehab",[["Help a stroke survivor practice getting dressed","care"],["Teach someone to cook with one hand","hands"],["Cheer on small wins","lead"]]],
 ["1:00 PM","School visit",[["Work with a child on handwriting and focus","care"],["Turn therapy into a game","plan"],["Talk with the teacher and parents","people"]]],
 ["3:30 PM","Wrap up",[["Record each patient's progress","write"],["Change an activity that is too hard","fix"],["Drive between clinics or schools","travel"]]]],

{id:"ipm",name:"Factory production manager",pay:126000,yr:2025,paths:["college","earn"],pathText:"Bachelor's degree is typical. Some start on the factory floor and move up.",env:["move","people"],set:"warehouse",hat:"#FFFFFF",shirt:"#4B5F7A",

 ["9:00 AM","Machine down",[["Decide what to do while a line is stopped","rush"],["Work with mechanics to get it running","fix"],["Reschedule orders","plan"]]],
 ["1:00 PM","Improve",[["Review quality reports","detail"],["Find a way to cut waste","fix"],["Meet with engineers about a new product","team"]]],
 ["3:30 PM","People",[["Hire and train a new supervisor","people"],["Report to company leaders","write"],["Keep everyone safe","lead"]]]],
 skills:["Leading people","Problem-solving","Comfort with numbers","Staying organized"],
 steps:["Take math and business classes. A summer job in a plant or warehouse teaches a lot.","Choose a route: business or industrial engineering in college, or an entry job in manufacturing.","Earn the degree or work up from operator to supervisor to manager."],
 apply:"In the Gallup-Amazon data, about half of these managers do not have a bachelor's degree."},
{id:"forest",name:"Forester",pay:74000,yr:2025,paths:["college"],pathText:"Bachelor's degree in forestry or natural resources.",env:["out","move","travel"],set:"field",prop:"trees",hat:"#F4B321",shirt:"#3E7C59",
 blurb:"You take care of forests: which trees to cut, where to replant, and how to prevent wildfires. Much of the job is outside.",

 ["9:00 AM","Tree check",[["Measure trees and check their health","detail"],["Spot signs of insects or disease","fix"],["Work alone in quiet woods","out"]]],
 ["1:00 PM","Planning",[["Decide which trees to cut and where to replant","plan"],["Plan a controlled burn to prevent wildfires","rush"],["Meet a landowner or logging crew","people"]]],

 skills:["Biology and ecology","Fitness","Mapping software","Working alone"],
 steps:["Take biology and environmental science. Spend time outdoors: hiking, scouts, trail work.","Apply to colleges with forestry or natural resources programs.","Earn the degree. Summer jobs with state or national forests help you get hired."],
 apply:"Conservation scientists do similar work on rangeland and farms. Most jobs are in rural areas."},
{id:"land",name:"Landscape architect",pay:80000,yr:2025,paths:["college"],pathText:"Bachelor's degree in landscape architecture, then a state license.",env:["out","desk"],set:"office",sets:["office","field","office","field"],shirt:"#6B7F3A",
 blurb:"You design parks, campuses, playgrounds and gardens. You decide where the paths, trees and water go.",

 ["11:00 AM","Site walk",[["Walk the land to see slopes, sun and water","out"],["Measure and take photos","detail"],["Choose plants that will survive there","fix"]]],
 ["2:00 PM","The details",[["Work out drainage so the park doesn't flood","math"],["Estimate what it will cost","math"],["Sit at a desk for the detailed drawings","desk"]]],

{id:"farm",name:"Farm or ranch manager",pay:90000,yr:2025,paths:["earn","college"],pathText:"Usually learned by working on a farm. Many also study agriculture in college.",env:["out","hands","move"],set:"field",prop:"barn",hat:"#D9A766",shirt:"#35618F",
 blurb:"You run a farm or ranch: crops, animals, equipment, workers and money. You are outside in every season.",

 ["9:00 AM","Equipment",[["Fix a broken tractor","hands"],["Drive heavy machinery in the field","hands"],["Decide what to plant based on prices","plan"]]],
 ["1:00 PM","A sick cow",[["Help a cow that is sick or giving birth","animal"],["Call the vet and explain what you see","people"],["Manage a crew of workers","lead"]]],

 skills:["Animal and crop knowledge","Mechanical skill","Business sense","Stamina"],
 steps:["Join FFA or 4-H if your school has it. Get a summer job on a farm.","Look at agriculture programs at community colleges and state universities.","Work on a farm, study agriculture, or both. Many managers do both."],
 apply:"Honest note: this figure is for hired managers. Most farmers work for themselves, and their income can swing a lot from year to year."},
{id:"dvm",name:"Veterinarian",pay:130000,yr:2025,paths:["college"],wait:8,chip:"College plus graduate school",pathText:"Bachelor's degree, then 4 years of veterinary school and a license. About 8 years in all.",env:["people","hands"],set:"vet",shirt:"#F5F8FA",

{id:"wild",name:"Wildlife biologist",pay:77000,yr:2025,paths:["college"],pathText:"Bachelor's degree in biology or wildlife science. Research jobs often need a master's degree.",env:["out","move","travel"],set:"field",prop:"wild",sets:["field","field","office","office"],hat:"#D9A766",shirt:"#6B7F3A",

{id:"train",name:"Animal trainer",pay:40000,yr:2025,paths:["earn"],pathText:"Learned on the job. Zoo and aquarium jobs often want a college degree in biology or animal science.",env:["out","people","move"],set:"field",prop:"dog",shirt:"#8A5A9E",

{id:"mua",name:"Film and TV makeup artist",pay:97000,yr:2025,paths:["short"],wait:1,pathText:"A makeup or cosmetology program, often under a year, plus a state license in many states. Then you build a portfolio and work your way onto sets.",env:["people","hands","travel"],set:"studio",hat:"#B5587A",shirt:"#E8DCC0",

 ["11:00 AM","Special effects",[["Glue on a fake scar made of silicone","hands"],["Mix fake blood until the director likes the color","fix"],["Work fast, because the whole crew is waiting","rush"]]],

{id:"perf",name:"Perfumer",pay:91000,yr:2025,paths:["college"],wait:4,chip:"College plus perfumery training",pathText:"A bachelor's degree in chemistry, then several years of training inside a fragrance company or at a perfumery school.",env:["hands","desk","people"],set:"lab",hat:"#FFFFFF",shirt:"#7A5BA6",

 ["1:00 PM","In the lab",[["Weigh tiny drops on a very exact scale","detail"],["Mix version 14 of the same scent","hands"],["Test whether the scent holds up in soap","fix"]]],

 steps:["Take chemistry and biology, and AP Chemistry if you can. Keep a smell journal of spices, flowers and foods.","Look for colleges with strong chemistry programs. A few also offer cosmetic science.","Earn a chemistry degree, then apply to trainee programs at fragrance and flavor companies."],

{id:"dive",name:"Underwater welder",pay:73000,yr:2025,paths:["short"],wait:1,pathText:"Commercial diving school (about 5 to 7 months) plus welding training. Many start as a diver's helper, called a tender.",env:["out","hands","travel"],set:"sea",hat:"#F4B321",shirt:"#22384A",

 steps:["Take shop or welding classes if your school has them, plus physics. Learn to swim well, and get scuba certified if you can.","Research accredited commercial diving schools and what they cost. Look at welding certifications too.","Graduate, pass a diving medical exam, finish diving school, and start as a tender on a dive crew."],

{id:"boil",name:"Boilermaker",pay:76000,yr:2025,paths:["earn"],pathText:"Paid apprenticeship, about 4 years. No college needed.",env:["hands","move","travel"],set:"tank",hat:"#F4B321",shirt:"#3F78B5",

{id:"atc",name:"Air traffic controller",pay:148000,yr:2025,paths:["short"],wait:2,pathText:"An FAA-approved college aviation program, a degree, or 3 years of work experience. Then apply to the FAA before age 31 and train at the FAA Academy.",env:["desk","people"],set:"tower",hat:"#22384A",shirt:"#FFFFFF",

{id:"nuke",name:"Nuclear reactor operator",pay:123000,yr:2025,paths:["earn"],pathText:"Start as a plant equipment operator after high school, college or the Navy's nuclear program. Paid training for several years, then a federal license.",env:["desk","hands"],set:"control",hat:"#FFFFFF",shirt:"#2F6F9F",

{id:"onp",name:"Prosthetist and orthotist",pay:81000,yr:2025,paths:["college"],wait:7,chip:"College plus graduate school",pathText:"A bachelor's degree, a master's in orthotics and prosthetics, then a one-year residency and certification. About 7 years in all.",env:["people","hands"],sets:["clinic","lab","lab","clinic"],prop:"leg",hat:"#3F78B5",shirt:"#3F78B5",

{id:"einsp",name:"Elevator inspector",pay:75000,yr:2025,paths:["earn"],pathText:"Most start as elevator mechanics in a paid apprenticeship. After several years, they earn an inspector certification.",env:["hands","move","travel"],sets:["shaft","shaft","office","shaft"],hat:"#FFFFFF",shirt:"#4A6FA5",

{id:"court",name:"Court reporter",pay:72000,yr:2025,paths:["short"],wait:2,pathText:"A court reporting or captioning program at a community college or technical school, often 2 years, plus a license in many states.",env:["desk","people"],set:"court",hat:"#22384A",shirt:"#7A5BA6",

{id:"windmgr",name:"Wind farm site manager",pay:142000,yr:2025,paths:["short"],wait:2,pathText:"Usually start as a wind turbine technician after a 2-year program, then become a manager after about 5 years. A bachelor's degree helps but isn't always required.",env:["out","people","travel"],sets:["office","wind","wind","office"],hat:"#FFFFFF",shirt:"#3E7C59",
 blurb:"You run a wind farm: the turbines, the crew, the budget and the safety plan. Most managers started out climbing the towers themselves.",
 day:[["7:00 AM","Morning meeting",[["Lead the safety meeting with your technicians","lead"],["Check which turbines stopped overnight","fix"],["Assign repair jobs for the day","plan"]]],
 ["9:30 AM","Out in the field",[["Drive the gravel roads between turbines","out"],["Climb a tower with a technician to see a problem","high"],["Talk with a farmer whose land has turbines on it","people"]]],
 ["1:00 PM","Numbers",[["Check how much power each turbine made","math"],["Order a replacement part worth thousands","plan"],["Compare repair costs from two companies","math"]]],
 ["3:30 PM","Wrap-up",[["Report the site's numbers to headquarters","write"],["Interview a new technician","people"],["Plan for a storm coming this weekend","plan"]]]],
 skills:["Leadership","Mechanical and electrical know-how","Budgets","Safety planning"],
 steps:["Take algebra, physics and any shop or electronics classes.","Look into wind technician programs at community colleges.","Graduate, work as a wind technician, then step up to lead technician and site manager."],
 apply:"Honest note: the government doesn't count wind site managers separately, so the pay shown is for a broad group of managers. Real job ads vary a lot, from about $75K to around $145K, depending on the company and the size of the site."},
{id:"sfx",name:"Special effects artist",pay:102000,yr:2025,paths:["college"],pathText:"A bachelor's degree in animation, computer graphics or art is common. Your portfolio, called a demo reel, matters most.",env:["desk","people"],set:"office",hat:"#B5587A",shirt:"#22384A",
 blurb:"You create the explosions, creatures, smoke and magic in movies, TV and video games, mostly on a computer.",
 day:[["9:30 AM","Daily review",[["Show yesterday's shot to the director on a big screen","people"],["Take notes on what to change","write"],["Plan today's fixes with your team","team"]]],
 ["11:00 AM","Building the shot",[["Build a 3D dragon wing, one piece at a time","tech"],["Match the light in your shot to the real footage","detail"],["Study how real fire moves","fix"]]],
 ["2:00 PM","Crunch time",[["The release date is close, so the work speeds up","rush"],["Let the computer run a smoke simulation","tech"],["Fix a glitch that only shows up in one frame","fix"]]],
 ["5:00 PM","End of day",[["Send your shot to the next artist","team"],["Update your demo reel with your best work","plan"],["Learn a new software trick","tech"]]]],
 skills:["3D software","An artist's eye","Patience with tiny details","Taking feedback"],
 steps:["Take art, computer science and physics. Try free 3D software like Blender and make short clips.","Look at colleges and art schools with animation or visual effects programs. Start a demo reel.","Graduate, polish your reel, and apply for junior artist jobs at studios and game companies."],
 apply:"Honest note: many special effects artists are freelancers who go from project to project. Deadlines can mean long hours near a release."},
{id:"cvt",name:"Cardiovascular technologist",pay:74000,yr:2025,paths:["short"],wait:2,pathText:"A 2-year associate degree or a 1-year certificate program, then a professional certification.",env:["people","hands"],sets:["clinic","scan","scan","clinic"],hat:"#3F78B5",shirt:"#3F78B5",
 blurb:"You help doctors check people's hearts. You run heart tests, use ultrasound, and assist during heart procedures.",
 day:[["7:00 AM","First patient",[["Calm a nervous patient before a heart test","care"],["Place sensors in exactly the right spots","detail"],["Explain what will happen, step by step","people"]]],
 ["9:30 AM","Heart ultrasound",[["Move the ultrasound wand to see the heart beating","hands"],["Take measurements of the heart's valves","math"],["Spot something unusual and flag it for the doctor","fix"]]],
 ["12:30 PM","In the procedure room",[["Assist the team during a heart procedure","team"],["Watch the monitors and call out changes fast","rush"],["Keep everything sterile","detail"]]],
 ["3:30 PM","Reports",[["Save images and notes for the doctor","tech"],["Clean and check the equipment","detail"],["Be ready if an emergency patient comes in","rush"]]]],
 skills:["Anatomy","Using medical equipment","Calm under pressure","Caring for patients"],
 steps:["Take biology, anatomy and algebra. Volunteer at a hospital if you can.","Look for accredited cardiovascular technology programs at community colleges.","Graduate, finish the program, and pass a certification exam."],
 apply:"Hospitals are open around the clock, so some jobs include nights, weekends or on-call shifts."},
{id:"finsp",name:"Fire inspector",pay:76000,yr:2025,paths:["earn"],pathText:"Most start as firefighters, then train for the inspector job on the job and earn a certification. Some cities hire inspectors with construction experience.",env:["move","people","travel"],sets:["office","house","site","house"],hat:"#C2452F",shirt:"#22384A",
 blurb:"You stop fires before they start. You check buildings for fire dangers, and some inspectors investigate how a fire started.",
 day:[["8:00 AM","Morning route",[["Drive to a school for its yearly fire inspection","travel"],["Check that every exit sign lights up","detail"],["Test the fire alarms with the principal","people"]]],
 ["10:30 AM","A new restaurant",[["Make sure the kitchen fire system works","fix"],["Explain to the owner what must change before opening","people"],["Stand firm when the owner pushes back","lead"]]],
 ["1:00 PM","Construction site",[["Check sprinkler plans against the building code","detail"],["Climb ladders to look at the ceiling","move"],["Write up problems for the builder","write"]]],
 ["3:30 PM","Fire scene",[["Help investigate a house fire","fix"],["Photograph clues in the burned rooms","detail"],["Work in smoke-smelling, messy places","out"]]]],
 skills:["Knowing fire codes","Noticing small details","Clear writing","Standing firm on safety"],
 steps:["Take chemistry and English. Look for a fire explorer or junior firefighter program near you.","Find out how your local fire department hires firefighters, and look at fire science certificates.","Graduate, become a firefighter, then train and certify as an inspector."],
 apply:"Inspectors usually work regular daytime hours, unlike firefighters, who work long shifts."},
{id:"rail",name:"Railroad conductor",pay:78000,yr:2025,paths:["earn"],pathText:"A high school diploma, then several months of paid training from the railroad. No college needed.",env:["out","travel","move"],set:"rail",hat:"#22384A",shirt:"#D9822B",
 blurb:"You're in charge of a freight or passenger train and its crew. You make sure the right cars get to the right places, safely.",
 day:[["5:00 AM","Called in",[["Get the call two hours before your train leaves","rush"],["Meet the engineer at the rail yard","team"],["Read the list of every car on your train","detail"]]],
 ["7:00 AM","Building the train",[["Walk the length of the train in all weather","out"],["Hook up cars and check the brakes","hands"],["Talk by radio with the yard office","people"]]],
 ["10:00 AM","On the road",[["Ride in the engine across three states","travel"],["Watch for signals and track warnings","detail"],["Fix a problem with a car door at a stop","fix"]]],
 ["4:00 PM","End of the run",[["Drop cars at a factory","plan"],["Fill out the trip report","write"],["Sleep at a hotel before the trip home","travel"]]]],
 skills:["Following safety rules","Teamwork","Paying attention for long hours","Being okay with odd schedules"],
 steps:["Take math and any shop classes. Get your driver's license.","Look up railroad companies near you and how they hire conductor trainees.","Graduate, pass the hiring tests and medical exam, and start paid training."],
 apply:"Honest note: many freight conductors are on call, so you may be called in at any hour and spend nights away from home."},
{id:"safety",name:"Workplace safety technician",pay:62000,yr:2025,paths:["earn","short"],pathText:"A high school diploma and on-the-job training, or a 1- or 2-year safety program. Certifications help you move up.",env:["move","people","travel"],sets:["site","warehouse","site","office"],hat:"#F4B321",shirt:"#D9822B",
 blurb:"You keep workers from getting hurt. You inspect worksites, test for dangers like noise or fumes, and teach safety.",
 day:[["7:00 AM","Safety talk",[["Lead a 10-minute safety talk with a crew","lead"],["Explain how to wear a harness the right way","people"],["Answer questions from new workers","people"]]],
 ["9:00 AM","Walk the site",[["Look for missing guardrails and loose cables","detail"],["Test the air for dust or fumes","tech"],["Ask a worker to stop an unsafe job","rush"]]],
 ["1:00 PM","In the warehouse",[["Measure how loud the machines are","math"],["Check that forklifts were inspected","detail"],["Look into why someone tripped yesterday","fix"]]],
 ["3:30 PM","Reports",[["Write up what you found","write"],["Plan next week's training","plan"],["Order new safety gear","plan"]]]],
 skills:["Spotting hazards","Teaching people","Speaking up","Keeping good records"],
 steps:["Take biology, chemistry and math. Speaking up in class helps too.","Look into OSHA safety courses and safety certificate programs at community colleges.","Graduate, start in a safety or construction job, and earn safety certifications."],
 apply:"With a bachelor's degree later on, safety specialists earn more, about $90K. Your work experience can count toward it."},
{id:"plant",name:"Power plant operator",pay:105000,yr:2025,paths:["earn"],pathText:"A high school diploma, then years of paid on-the-job training. Some take a power plant technology program first.",env:["desk","hands"],sets:["control","site","control","control"],hat:"#FFFFFF",shirt:"#3F78B5",
 blurb:"You run the machines that make electricity, from gas and coal plants to hydro dams and solar farms. Some operators direct power across the grid.",
 day:[["6:00 AM","Shift handoff",[["Hear what happened overnight from the last crew","team"],["Check all the screens in the control room","tech"],["Read the day's power demand forecast","plan"]]],
 ["9:00 AM","Rounds",[["Walk the plant checking pumps and turbines","move"],["Listen for strange noises from machines","fix"],["Write down gauge readings","detail"]]],
 ["1:00 PM","Heat wave",[["Air conditioners spike demand, so raise power output","rush"],["Adjust controls carefully","detail"],["Coordinate with the grid by phone","people"]]],
 ["4:00 PM","Wrap-up",[["Log every change you made","write"],["Do a safety drill","team"],["Study for your next certification","plan"]]]],
 skills:["Reading gauges and controls","Mechanical know-how","Staying calm","Following procedures"],
 steps:["Take algebra, physics and any shop or electronics classes.","Look at power plant technology programs and utility company apprenticeships near you.","Graduate, get hired as a plant helper or trainee, and learn on the job."],
 apply:"Plants run day and night, so expect rotating shifts. The number of jobs is expected to shrink a bit, so look at several utilities."},
{id:"millw",name:"Industrial maintenance mechanic",pay:65000,yr:2025,paths:["earn","short"],pathText:"Paid on-the-job training or an apprenticeship of up to 4 years. Some take a 2-year industrial maintenance program first.",env:["hands","move"],sets:["warehouse","control","warehouse","office"],hat:"#F4B321",shirt:"#56697A",
 blurb:"You keep factory machines running: robots, conveyor belts and packaging lines. When a line stops, everyone calls you.",
 day:[["6:00 AM","Start of shift",[["Check the list of machines that broke overnight","plan"],["Grease and tighten parts on a schedule","hands"],["Read a machine's manual and diagrams","detail"]]],
 ["9:00 AM","Line down!",[["A conveyor stops and the whole factory waits","rush"],["Find the broken sensor","fix"],["Swap it out and test it","hands"]]],
 ["1:00 PM","New machine",[["Help install a new robot arm","team"],["Line it up to a fraction of an inch","detail"],["Weld a new mounting bracket","hands"]]],
 ["3:30 PM","Wrap-up",[["Log the repairs on a computer","tech"],["Order parts before they run out","plan"],["Teach a new worker the shutdown steps","people"]]]],
 skills:["Mechanical and electrical skills","Troubleshooting","Reading diagrams","Working fast when it counts"],
 steps:["Take shop, algebra and physics. Robotics club is great practice.","Look into industrial maintenance programs and factory apprenticeships near you.","Graduate and apply to factories that train maintenance workers."],
 apply:"Jobs in this field are expected to grow much faster than average. Overtime and on-call shifts are common."},
{id:"diesel",name:"Diesel technician",pay:62000,yr:2025,paths:["earn","short"],pathText:"Learn on the job after high school, or take a 1- to 2-year diesel technology program. Certifications raise your pay.",env:["hands","move"],set:"garage",hat:"#C2452F",shirt:"#22384A",
 blurb:"You fix the big engines in trucks, buses and heavy equipment. Without you, deliveries stop.",
 day:[["7:00 AM","Morning check",[["Read the work orders for today's trucks","plan"],["Plug a laptop into a truck to read its error codes","tech"],["Talk with a driver about a strange noise","people"]]],
 ["9:30 AM","Engine work",[["Take apart part of a huge engine","hands"],["Find a cracked part","fix"],["Lift heavy parts with a hoist","move"]]],
 ["1:00 PM","Road call",[["Drive the service truck to a broken-down bus","travel"],["Fix it on the side of the road","out"],["Work fast so passengers can get going","rush"]]],
 ["3:30 PM","Back at the shop",[["Test-drive the repaired truck","fix"],["Write up the repair","write"],["Clean your tools","detail"]]]],
 skills:["Engines and electronics","Troubleshooting","Strength","Using computer diagnostics"],
 steps:["Take auto shop, physics and math. Work on engines whenever you can.","Compare diesel programs at community colleges and trade schools.","Graduate, get hired as an apprentice or entry-level tech, and earn certifications."],
 apply:"Many employers will help pay for training and certifications. The work is greasy and physical."},
{id:"iron",name:"Ironworker",pay:63000,yr:2025,paths:["earn"],pathText:"Paid apprenticeship, usually 3 to 4 years. No college needed.",env:["out","hands","move"],sets:["site","site","site","site"],hat:"#F4B321",shirt:"#C2452F",
 blurb:"You put up the steel skeletons of skyscrapers, bridges and stadiums, often hundreds of feet in the air.",
 day:[["6:30 AM","Safety huddle",[["Go over the day's lifts with your crew","team"],["Check your harness and gear","detail"],["Ride the hoist up the building","high"]]],
 ["8:00 AM","Setting steel",[["Guide a steel beam as the crane lowers it","high"],["Signal the crane operator by hand","team"],["Bolt the beam into place","hands"]]],
 ["12:30 PM","Welding",[["Weld connections between beams","hands"],["Work outside in sun, wind or cold","out"],["Follow the blueprints exactly","detail"]]],
 ["3:00 PM","End of day",[["Lay metal decking for the next floor","move"],["Look out over the city from the top","high"],["Pack up before the wind picks up","plan"]]]],
 skills:["Comfort with heights","Welding and rigging","Teamwork","Strength and balance"],
 steps:["Take algebra, geometry and shop or welding.","Find your local ironworkers' apprenticeship and when it takes applications.","Graduate, pass the entrance steps, and start paid training."],
 apply:"Pay varies a lot by city. Union ironworkers in big cities often earn far more than the typical figure."},
{id:"meng",name:"Mechanical engineer",pay:104000,yr:2025,paths:["college"],pathText:"A 4-year bachelor's degree in mechanical engineering. A license helps later for some jobs.",env:["desk","hands","people"],sets:["office","warehouse","office","site"],hat:"#FFFFFF",shirt:"#3F78B5",
 blurb:"You design machines and things that move: car parts, robots, engines, medical devices and heating systems.",
 day:[["9:00 AM","Team meeting",[["Go over a new electric bike design with your team","team"],["Talk about what failed in last week's test","fix"],["Plan who does what this week","plan"]]],
 ["10:30 AM","Design time",[["Build a 3D model of a part on the computer","tech"],["Do the math on how much weight it can hold","math"],["Pick the right metal or plastic","detail"]]],
 ["1:30 PM","In the lab",[["Test a prototype until it breaks","hands"],["Measure where it broke","detail"],["Figure out why","fix"]]],
 ["4:00 PM","Wrap-up",[["Write up the test results","write"],["Send the new design to the factory","people"],["Sketch an idea for tomorrow","plan"]]]],
 skills:["Math and physics","3D design software","Problem-solving","Teamwork"],
 steps:["Take the most advanced math and physics you can. Join robotics or an engineering club.","Look for colleges with accredited engineering programs. Ask about co-ops, where you work and get paid during college.","Graduate, get into an engineering program, and look for internships each summer."],
 apply:"Jobs are expected to grow much faster than average. Engineering programs are math-heavy, so calculus in high school helps."},
{id:"doc",name:"Doctor",pay:276000,yr:2025,paths:["college"],wait:11,chip:"College, medical school and residency",pathText:"A 4-year degree, 4 years of medical school, then 3 to 7 years of paid residency training. About 11 years or more after high school.",env:["people","move"],sets:["clinic","clinic","scan","clinic"],hat:"#FFFFFF",shirt:"#7FB8D4",
 blurb:"You figure out what's making people sick and treat them. There are dozens of kinds of doctors, from family doctors to surgeons.",
 day:[["7:00 AM","Hospital rounds",[["Check on patients who stayed overnight","care"],["Read their test results","detail"],["Teach a medical student as you go","lead"]]],
 ["9:30 AM","Clinic",[["See a new patient every 15 to 20 minutes","rush"],["Ask questions to figure out what's wrong","fix"],["Explain a diagnosis in plain words","people"]]],
 ["1:00 PM","A hard case",[["Look at a scan with a specialist","team"],["Decide on a treatment plan","lead"],["Break difficult news to a family","care"]]],
 ["5:00 PM","Notes",[["Write notes for every patient","write"],["Answer calls from nurses","people"],["Read about a new treatment","detail"]]]],
 skills:["Science","Listening","Making decisions under pressure","Stamina for long training"],
 steps:["Take biology, chemistry and math, and AP science if you can. Volunteer at a hospital or clinic.","Look for colleges with strong pre-med advising. Any major works if you take the required science classes.","Graduate, earn strong grades in college, take the MCAT, and apply to medical school."],
 apply:"Honest note: it's a long road, and many students take on loans. Pay is high and varies a lot by specialty. Physician assistants and nurses do similar work with less school."},
{id:"law",name:"Lawyer",pay:160000,yr:2025,paths:["college"],wait:7,chip:"College plus law school",pathText:"A 4-year degree in any subject, 3 years of law school, then a state bar exam.",env:["desk","people"],sets:["office","office","court","office"],hat:"#22384A",shirt:"#22384A",
 blurb:"You help people and companies with legal problems: contracts, disputes, crimes, families and more. Most of the work is reading, writing and advising.",
 day:[["8:30 AM","Email and calls",[["Answer a client worried about a contract","people"],["Plan your day around a court date","plan"],["Check a deadline that can't be missed","detail"]]],
 ["10:00 AM","Research",[["Read past court cases that match yours","detail"],["Write a 20-page argument","write"],["Find the weak spot in the other side's case","fix"]]],
 ["1:30 PM","Court",[["Argue your case in front of a judge","people"],["Think fast when the judge asks a tough question","rush"],["Stay calm and professional","lead"]]],
 ["4:00 PM","Back at the office",[["Meet a new client","people"],["Bargain with the other lawyer to settle","lead"],["Track your hours for billing","math"]]]],
 skills:["Reading closely","Persuasive writing","Speaking up","Arguing both sides"],
 steps:["Take English, history and government. Join debate, mock trial or student government.","Pick colleges with strong writing programs. Any major works for law school.","Graduate, get good grades in college, take the LSAT, and apply to law schools."],
 apply:"Honest note: law school is expensive and pay varies a lot. Big-firm lawyers earn far more than public defenders. Paralegals do legal work with a 2-year degree."},
{id:"athlete",name:"Professional athlete",pay:67000,yr:2025,paths:["college"],wait:4,chip:"Talent and years of training, often college sports",pathText:"No degree is required, but most pros play in college first. Years of training, then a team, league or tour picks you.",env:["move","people","travel"],sets:["gym","field","gym","field"],hat:"#C2452F",shirt:"#3F78B5",
 blurb:"You compete for a living in a team sport or on a tour. Very few people make it, so most pros have a backup plan.",
 day:[["7:00 AM","Training",[["Lift weights with the strength coach","move"],["Follow a strict meal plan","detail"],["Get treatment for a sore shoulder","care"]]],
 ["10:00 AM","Practice",[["Run plays with the team","team"],["Take hard feedback from the coach","people"],["Push through when you're tired","rush"]]],
 ["2:00 PM","Film study",[["Watch video of your next opponent","detail"],["Plan how to beat them","plan"],["Talk with reporters","people"]]],
 ["7:00 PM","Game time",[["Perform in front of a crowd","rush"],["Travel to the next city","travel"],["Recover and rest","plan"]]]],
 skills:["Athletic talent","Discipline","Teamwork","Handling pressure"],
 steps:["Train hard, keep your grades up, and play at the highest level you can. Coaches care about grades too.","Learn the NCAA eligibility rules and talk to your coach about college sports.","Graduate, keep training, and keep a backup plan in a related field."],
 apply:"Honest note: there are only about 15,000 of these jobs in the whole country, and careers are often short. Related jobs with many more openings include physical therapist, athletic trainer, coach and sports marketing."},
{id:"music",name:"Musician or singer",pay:0,hr:47.80,yr:2025,paths:["short"],wait:1,chip:"Years of practice; college is optional",pathText:"No degree is required. Most musicians practice for years. Classical and music-teaching jobs usually need a college degree.",env:["people","travel"],set:"stage",hat:"#7A5BA6",shirt:"#F4B321",
 blurb:"You perform, record or write music: in bands, orchestras, churches, studios or on tour. Most musicians mix several kinds of gigs.",
 day:[["10:00 AM","Practice",[["Practice a hard section 50 times","detail"],["Write part of a new song","write"],["Record a demo on your laptop","tech"]]],
 ["1:00 PM","Teaching",[["Give guitar lessons to two students","people"],["Post a clip to find new fans","tech"],["Answer emails about a wedding gig","plan"]]],
 ["4:00 PM","Rehearsal",[["Rehearse with your band","team"],["Load gear into the van","move"],["Drive to the venue","travel"]]],
 ["9:00 PM","The show",[["Perform for a live crowd","rush"],["Sell merch and meet fans","people"],["Get home after midnight","move"]]]],
 skills:["Musical skill","Practice habits","Promoting yourself","Being reliable"],
 steps:["Join band, choir or orchestra, and practice every day. Start recording yourself.","Look at music programs and conservatories, and at community colleges with music production.","Graduate, keep performing, and build a list of fans and contacts."],
 apply:"Honest note: the government gives an hourly figure only, because most music work isn't full-time or year-round. About half of musicians work for themselves, and many have a second job."},
{id:"actor",name:"Actor",pay:0,hr:29.05,yr:2025,paths:["short"],wait:2,chip:"Training and experience; college is optional",pathText:"No degree is required, but most actors take classes or study theater. You build experience role by role.",env:["people","travel"],set:"stage",hat:"#B5587A",shirt:"#C2452F",
 blurb:"You bring characters to life on stage, in film, on TV, in commercials and in video games.",
 day:[["8:00 AM","Audition",[["Wait with 50 other actors for a 2-minute audition","rush"],["Perform a scene you memorized","people"],["Hear 'thank you, next' and keep going","lead"]]],
 ["11:00 AM","Side job",[["Work a shift at your other job","people"],["Learn lines on your break","detail"],["Check your email for callbacks","plan"]]],
 ["3:00 PM","Rehearsal",[["Rehearse a play with the cast","team"],["Take notes from the director","people"],["Try a scene five different ways","fix"]]],
 ["7:30 PM","Show",[["Get into makeup and costume","hands"],["Perform for a live audience","rush"],["Do it again tomorrow night","move"]]]],
 skills:["Memorizing lines","Taking direction","Handling rejection","Speaking clearly"],
 steps:["Join theater, take drama classes, and act in community or school shows.","Look at theater programs and acting classes, and at summer theater programs.","Graduate, keep training, build a reel of your work, and audition often."],
 apply:"Honest note: the government gives only an hourly figure, because most acting work is short-term. Many actors work other jobs between roles."},
{id:"mil",name:"Military (enlisted)",pay:28900,yr:2026,payLine:"Starting basic pay is about <b>$2,400 a month</b> in 2026. Housing, meals and health care come on top. Counting housing, food and tax savings, a mid-career enlisted member (rank E-5) averaged about <b>$86K a year</b> in 2025.",src:"Sources: Defense Finance and Accounting Service 2026 pay tables; Congressional Research Service.",paths:["earn"],pathText:"Enlist after high school. Basic training lasts about 2 to 3 months, then you go to paid training for your military job.",env:["move","hands","travel","out"],sets:["field","hangar","office","field"],hat:"#3E7C59",shirt:"#3E7C59",
 blurb:"You serve in the Army, Navy, Air Force, Marines, Space Force or Coast Guard. Most enlisted members train for a specific job, like mechanic, medic, electrician or IT.",
 day:[["5:30 AM","Formation",[["Line up with your unit for morning roll call","team"],["Do physical training with your squad","move"],["Follow orders right away","detail"]]],
 ["8:00 AM","Your military job",[["Fix a helicopter engine with your crew","hands"],["Follow the technical manual step by step","detail"],["Get checked by your supervisor","people"]]],
 ["1:00 PM","Training",[["Practice for a field exercise outdoors","out"],["Learn to lead a small team","lead"],["Study for your next promotion","plan"]]],
 ["5:00 PM","After duty",[["Take free college classes online","plan"],["Hang out with friends on base","people"],["Get ready to deploy overseas next month","travel"]]]],
 skills:["Discipline","Physical fitness","Teamwork","Following instructions"],
 steps:["Stay in shape, keep your grades up, and stay out of legal trouble. Take a practice ASVAB, the military's entrance test.","Talk to recruiters from more than one branch, and bring a parent or counselor. Your ASVAB score decides which jobs you qualify for.","Graduate, pass the medical exam, sign your contract, and leave for basic training."],
 apply:"Honest note: you sign a contract for several years, and deployments can be dangerous and far from home. Get your job choice in writing. Many military jobs train you for civilian careers already in this app, like electrician, aircraft mechanic, paramedic and network administrator, and the GI Bill helps pay for college later."},
{id:"chef",name:"Chef",pay:62000,yr:2025,paths:["earn","short"],pathText:"Most chefs work their way up in kitchens over about 5 years. Some take a culinary program or a culinary apprenticeship first.",env:["hands","move","people"],set:"kitchen",hat:"#FFFFFF",shirt:"#FFFFFF",
 blurb:"You run a kitchen: you plan the menu, lead the cooks, and make sure every plate is right. Most chefs start as line cooks.",
 day:[["9:00 AM","Deliveries",[["Check the fish and vegetables that just arrived","detail"],["Order what's running low","plan"],["Work out food costs for a new dish","math"]]],
 ["11:00 AM","Prep",[["Show a new cook how to cut onions fast","lead"],["Taste every sauce","detail"],["Test a dish for next week's menu","hands"]]],
 ["6:00 PM","Dinner rush",[["Call out orders as tickets pour in","rush"],["Keep 10 cooks moving together","team"],["Fix a plate before it goes out","fix"]]],
 ["10:30 PM","Closing",[["Make sure the kitchen is spotless","detail"],["Thank the crew","people"],["Plan tomorrow's specials","plan"]]]],
 skills:["Cooking","Leading a team","Staying calm under pressure","Managing costs"],
 steps:["Cook at home, take culinary or food classes, and look for a restaurant job.","Look at culinary programs, high school career-tech cooking programs, and culinary apprenticeships.","Graduate, work your way up from line cook, and keep learning new cuisines."],
 apply:"Kitchens are hot and fast, and chefs work nights, weekends and holidays. Jobs are expected to grow much faster than average."},
{id:"hair",name:"Hairstylist or barber",pay:36000,yr:2025,paths:["short"],wait:1,pathText:"A state-approved cosmetology or barber program, often under 2 years, then a state license exam.",env:["people","hands"],set:"studio",hat:"#F2917A",shirt:"#3E7C59",
 blurb:"You cut, color and style hair and help people feel good about how they look. Many stylists build a loyal list of clients.",
 day:[["9:00 AM","First client",[["Ask a client what look they want","people"],["Cut and style with scissors and clippers","hands"],["Make small, careful changes","detail"]]],
 ["11:00 AM","Color",[["Mix hair color to match a photo","detail"],["Time each step exactly","plan"],["Chat while the color sets","people"]]],

function kAmt(n){return "~$"+Math.round(n/1000)+"K/yr";}
function pShort(c){var m={"College plus graduate school":"4-yr degree + grad school","College plus flight training":"college + flight training"};if(c.chip)return m[c.chip]||c.chip;

function sentences(t){return String(t).replace(/\.\s+(?=[A-Z])/g,".\u0001").split("\u0001").filter(Boolean);}
function abbrLabel(l){return {"This year (11th grade)":"This yr (11th)","This year (12th grade)":"This yr (12th)","Now through 11th grade":"Now through 11th","In high school":"In HS","Senior year":"Sr. yr","After graduation":"After HS","If you haven't yet":"If not done yet","Junior year":"Jr. yr"}[l]||l;}
