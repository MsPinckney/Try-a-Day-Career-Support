<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Try a Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column, one decision per screen; the workday itself (a sun crossing a track) is the progress bar. */
:root{
  --paper:#EAF0F4; --card:#FFFFFF; --ink:#10283A; --muted:#506475; --line:#CFDBE4;
  --accent:#F4B321; --accent-ink:#10283A; --good:#177A53; --bad:#B53D28; --soft:#DDE7EE;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1B27; --card:#162A3A; --ink:#EAF1F5; --muted:#9FB2C1; --line:#2A455C;
    --accent:#F4B321; --accent-ink:#10283A; --good:#56C898; --bad:#F2917A; --soft:#1E3649;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1B27; --card:#162A3A; --ink:#EAF1F5; --muted:#9FB2C1; --line:#2A455C;
  --accent:#F4B321; --accent-ink:#10283A; --good:#56C898; --bad:#F2917A; --soft:#1E3649;
  color-scheme:dark;
}
/* Guardian themes: teal for planning for a child, plum for planning for yourself */
:root[data-mode="guard"]{--paper:#E6F2EF;--soft:#D2E8E2;--line:#BCD9D1;--accent:#5CC6AE;--accent-ink:#0E2A26;--muted:#4C6661}
:root[data-mode="me"]{--paper:#EFEAF7;--soft:#E0D6F0;--line:#D0C2E8;--accent:#B79CF0;--accent-ink:#1F1236;--muted:#5F5475;--ink:#1F1A2E}
@media (prefers-color-scheme:dark){
 :root[data-mode="guard"]:not([data-theme="light"]){--paper:#0D1F1C;--card:#14302B;--soft:#1B3B35;--line:#25483F;--accent:#5CC6AE;--accent-ink:#0E2A26;--muted:#9CC0B8;--ink:#E8F4F1}
 :root[data-mode="me"]:not([data-theme="light"]){--paper:#18122A;--card:#241B3B;--soft:#2E2449;--line:#3D3160;--accent:#B79CF0;--accent-ink:#1F1236;--muted:#B5A9CF;--ink:#F0ECF8}
}
:root[data-theme="dark"][data-mode="guard"]{--paper:#0D1F1C;--card:#14302B;--soft:#1B3B35;--line:#25483F;--accent:#5CC6AE;--accent-ink:#0E2A26;--muted:#9CC0B8;--ink:#E8F4F1}
:root[data-theme="dark"][data-mode="me"]{--paper:#18122A;--card:#241B3B;--soft:#2E2449;--line:#3D3160;--accent:#B79CF0;--accent-ink:#1F1236;--muted:#B5A9CF;--ink:#F0ECF8}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 16px 32px}
.top{display:flex;align-items:center;gap:8px;padding:14px 0;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;margin-right:auto;background:none;border:0;padding:4px 0}
.brand i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:1px}
.ghost{background:transparent;border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px;min-height:44px}
.ghost:hover{border-color:var(--ink)}
.calm{border-color:var(--ink);font-weight:700}
main{display:flex;flex-direction:column;gap:18px;flex:1}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,7.2vw,44px);line-height:1.04;letter-spacing:-.025em;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:19px;margin:0}
p{margin:0;max-width:60ch}
.muted{color:var(--muted)}
.small{font-size:15px}
.step{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.big{font-family:var(--display);font-weight:800;font-size:clamp(64px,20vw,116px);line-height:.9;letter-spacing:-.04em}
.big span{background:linear-gradient(transparent 62%,var(--accent) 62%)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
@media (max-width:420px){.opts.two{grid-template-columns:1fr}}
.opt{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;text-align:left;min-height:64px;display:flex;flex-direction:column;gap:2px}
.opt b{font-size:19px}
.opt span{color:var(--muted);font-size:15px}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--accent);color:var(--accent-ink)}
.opt[aria-pressed="true"] span{color:var(--accent-ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.go{background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:14px 22px;font-weight:700;min-height:52px}
.go:disabled{opacity:.35;cursor:not-allowed}
.go.sun{background:var(--accent);color:var(--accent-ink)}
.link{background:none;border:0;padding:8px 2px;text-decoration:underline;text-underline-offset:3px;min-height:44px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--soft);border-radius:999px;padding:4px 12px;font-size:15px}
.chip.pay{background:var(--accent);color:var(--accent-ink);font-weight:700;font-variant-numeric:tabular-nums}
.job h3{font-size:22px;font-weight:800}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 14px;font-size:15px;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.scene{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--card);touch-action:pan-y}
.scene svg{display:block;width:100%;height:auto}
.clock{position:absolute;left:12px;top:10px;background:#10283A;color:#fff;font-family:var(--display);font-weight:800;font-size:22px;padding:4px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
.track{position:relative;height:28px;margin:2px 14px}
.track::before{content:"";position:absolute;left:0;right:0;top:13px;height:3px;background:var(--line);border-radius:2px}
.track i{position:absolute;top:8px;width:13px;height:13px;border-radius:50%;background:var(--line);transform:translateX(-50%)}
.track i.done{background:var(--ink)}
.track b{position:absolute;top:2px;width:25px;height:25px;border-radius:50%;background:var(--accent);border:3px solid var(--ink);transform:translateX(-50%);transition:left .4s ease}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.bubble::before,.bubble::after{content:"";position:absolute;background:var(--card);border:2px solid var(--line);border-radius:50%}
.bubble::before{width:14px;height:14px;top:-12px;left:34px}
.bubble::after{width:8px;height:8px;top:-22px;left:46px}
.bubble.up{border-color:var(--good)} .bubble.down{border-color:var(--bad)}
.vote{display:flex;gap:8px}
.vote button{flex:1;background:transparent;border:2px solid var(--line);border-radius:999px;padding:8px 10px;font-size:16px;min-height:44px}
.vote .y[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--card);font-weight:700}
.vote .n[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--card);font-weight:700}
.tag{font-size:13px;color:var(--muted)}
ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.steps{list-style:none;padding:0;gap:10px}
.steps li{border-left:4px solid var(--accent);padding-left:12px}
.steps.numbered{counter-reset:n;gap:14px}
.steps.numbered li{counter-increment:n;position:relative;padding-left:52px;border-left:0}
.steps.numbered li::before{content:counter(n);position:absolute;left:0;top:0;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center}
.steps.numbered strong{font-weight:700;white-space:nowrap}
.steps.numbered li b{text-transform:none;letter-spacing:0;font-size:18px;color:var(--ink)}
.steps.numbered li > b:first-child{margin-bottom:2px}
.steps b{display:block;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.note{border-left:4px solid var(--accent);padding:8px 12px;background:var(--soft);border-radius:0 10px 10px 0;font-size:16px}
.plantitle{font-size:clamp(32px,8vw,46px)}
.toc h3{font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.toc ul{list-style:disc;padding-left:22px;gap:8px}
.toc a{color:var(--ink);font-weight:700;font-size:18px;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:4px}
.toc a:hover{text-decoration-color:var(--ink)}
.plans{display:flex;flex-direction:column;gap:12px;padding-top:22px;border-top:2px solid var(--line)}
.planh{display:flex;align-items:center;gap:12px;font-size:28px;scroll-margin-top:16px}
.planh span{flex:none;width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:20px}
.plantitle{scroll-margin-top:16px}
.jobh{font-size:20px;font-weight:800}
.totop{align-self:flex-start;color:var(--muted);font-size:15px;padding:10px 0;min-height:44px}
.modebar{flex-basis:100%;display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:4px 6px 4px 14px;font-weight:700;font-size:15px}
.modebar .link{color:var(--accent-ink);padding:4px 8px;min-height:36px}
.modebar span{margin-right:auto}
.ghost.on{border-color:var(--ink);font-weight:700}
.row.wrap{flex-wrap:wrap}
.kidform{max-height:calc(100vh - 32px);overflow:auto}
.kidform .row button{white-space:nowrap}
.kidform input{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;min-height:52px}
.gatecard{border:2px dashed var(--line)}
.opt.wide{padding:20px}
.opt.wide b{font-size:21px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--soft);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stats b{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.stats span{font-size:13px;color:var(--muted)}
.glance{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.glance li{border-left:4px solid var(--accent);padding-left:12px;display:flex;flex-direction:column}
.glance span{font-size:16px;color:var(--muted)}
.search{display:flex;flex-direction:column;gap:6px}
.search label{font-weight:700}
.search input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;min-height:52px}
.search .row{flex-wrap:nowrap}
.chipbtn{border:0;cursor:pointer;min-height:40px;padding:6px 14px}
.chipbtn:hover{background:var(--accent);color:var(--accent-ink)}
.ledger{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 16px;font-variant-numeric:tabular-nums}
.ledger div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.ledger div:last-child{border-bottom:0;font-weight:700;font-size:20px}
.ledger .out{color:var(--bad)}
.sheet{position:fixed;inset:0;background:rgba(8,20,30,.72);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:5}
.sheet .card{max-width:520px;width:100%;gap:14px}
details summary{cursor:pointer;color:var(--muted);font-size:15px;min-height:44px;display:flex;align-items:center}
details p{font-size:15px;color:var(--muted);margin-bottom:8px}
select{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;min-height:48px;max-width:100%}
.fade{animation:in .28s ease}
@keyframes in{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.track b{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="hdr"></header>
  <main id="main"></main>
  <div id="sheet"></div>
</div>

{id:"carp",name:"Carpenter",pay:61000,yr:2025,paths:["earn"],pathText:"Paid apprenticeship, or start as a helper and learn on the job.",env:["hands","out","move"],set:"site",hat:"#F4B321",shirt:"#8A5A32",
 blurb:"You build the frames, floors, stairs and roofs of houses and buildings. At the end of the day you can see what you made.",
 day:[["6:30 AM","Set up",[["Unload lumber at the job site","move"],["Read the blueprint for today's framing","detail"],["Work outside in most weather","out"]]],
 ["8:30 AM","Framing",[["Measure, cut and nail wall frames","hands"],["Do quick math with fractions and angles","math"],["Lift walls into place with your crew","team"]]],
 ["12:30 PM","Up high",[["Set roof beams from a ladder or scaffold","high"],["Use saws and nail guns safely","detail"],["Keep moving all day","move"]]],
 ["3:00 PM","Finish",[["Fix a wall that is not square","fix"],["Look at what you built today","hands"],["Clean up the site","move"]]]],
 skills:["Measuring and fractions","Strength and stamina","Reading plans","Care with tools"],
 steps:["Take geometry and wood shop. Build something.","Look up carpentry apprenticeships, or ask local builders about summer helper jobs.","Graduate and start as an apprentice or helper."],
 apply:"Carpenters who learn to read plans and lead crews can move up to construction manager, one of the best-paid jobs here."},
{id:"emt",name:"Paramedic",pay:48000,yr:2025,paths:["short"],pathText:"EMT course of a few months to start. Paramedic training takes 1 to 2 years more.",env:["move","travel","people"],set:"street",veh:"amb",shirt:"#22384A",
 blurb:"You are the first medical help to reach people in an emergency. You treat them on the spot and on the way to the hospital.",
 day:[["7:00 AM","Shift start",[["Check the ambulance and restock supplies","detail"],["Start a 12-hour shift with your partner","team"],["Never know what the next call will be","rush"]]],
 ["9:30 AM","A call",[["Drive with lights and sirens","rush"],["Work out what happened in seconds","fix"],["Treat a patient on their kitchen floor","care"]]],
 ["1:00 PM","Transport",[["Lift a patient on a stretcher","move"],["Keep them stable on the way to the hospital","care"],["Report to the emergency room nurse","people"]]],
 ["4:30 PM","Late shift",[["Calm a frightened child","care"],["Write a report for every call","write"],["Work nights, weekends and holidays","rush"]]]],
 skills:["Staying calm","First aid and anatomy","Quick decisions","Physical strength"],
 steps:["Take biology and a CPR class. Ask a local ambulance service about a ride-along.","Find an EMT course at a community college. Some let you start at 18.","Earn EMT certification and work, then add paramedic training if you want more."],
 apply:"Honest note: the pay is low for how hard the work is. Many people use it as a first step toward nursing, firefighting or physician assistant."},
{id:"lpn",name:"Licensed practical nurse",pay:64000,yr:2025,paths:["short"],pathText:"Practical nursing program of about 1 year, then a license exam.",env:["people","move"],set:"clinic",shirt:"#A0527A",
 blurb:"You give basic nursing care in nursing homes, clinics and hospitals. It is one of the quickest ways into health care.",
 day:[["7:00 AM","Shift start",[["Get your patient list","team"],["Check each patient's vital signs","care"],["Be on your feet all shift","move"]]],
 ["9:30 AM","Morning care",[["Give medicines on schedule","detail"],["Change a bandage","hands"],["Chat with a resident who is lonely","people"]]],
 ["1:00 PM","Afternoon",[["Notice a patient seems worse and tell the registered nurse","fix"],["Help someone eat and bathe","care"],["Lift and move patients safely","move"]]],
 ["3:30 PM","Hand off",[["Chart everything you did","write"],["Explain care to a family","people"],["Brief the next shift","team"]]]],
 skills:["Compassion","Careful routines","Biology basics","Physical stamina"],
 steps:["Take biology. Volunteer at a nursing home to see if you like the work.","Apply to practical nursing programs at community or technical colleges.","Finish the program and pass the license exam."],
 apply:"Many practical nurses later take a bridge program to become registered nurses, who typically earn about $98,000."},
{id:"pt",name:"Physical therapist",pay:103000,yr:2025,paths:["college"],wait:7,chip:"College plus graduate school",pathText:"Bachelor's degree, then a 3-year Doctor of Physical Therapy program and a license. About 7 years in all.",env:["people","move"],set:"gym",shirt:"#2F7F86",
 blurb:"You help people move again after an injury, surgery or illness. You are active and working with people all day.",
 day:[["8:00 AM","Prepare",[["Read a new patient's injury history","detail"],["Plan the day's sessions","plan"],["Be active and on your feet","move"]]],
 ["9:30 AM","Evaluation",[["Test how far a knee bends after surgery","fix"],["Design an exercise plan for that person","plan"],["Explain the plan so they believe in it","people"]]],
 ["1:00 PM","Treatment",[["Guide a patient through exercises","care"],["Use your hands to stretch tight muscles","hands"],["Encourage someone who wants to quit","lead"]]],
 ["4:00 PM","Progress",[["Record each patient's progress","write"],["Celebrate when someone walks without a cane","care"],["See ten or more patients a day","people"]]]],
 skills:["Anatomy","Encouraging people","Problem-solving","Stamina"],
 steps:["Take biology, anatomy and physics. Ask to observe at a physical therapy clinic.","Apply to colleges. Any major works if you take the required science classes.","Earn a bachelor's degree, then apply to Doctor of Physical Therapy programs."],
 apply:"Want a shorter route? Physical therapist assistants do hands-on treatment with a 2-year degree."},
{id:"pa",name:"Physician assistant",pay:136000,yr:2025,paths:["college"],wait:7,chip:"College plus graduate school",pathText:"Bachelor's degree, patient-care experience, then a master's program of 2 to 3 years and a license.",env:["people","move"],set:"clinic",shirt:"#F5F8FA",
 blurb:"You examine patients, diagnose illness and prescribe medicine, working with a doctor. It takes fewer years than medical school.",
 day:[["8:00 AM","Morning huddle",[["Go over today's patients with the doctor","team"],["Read lab results","detail"],["Move from room to room all day","move"]]],
 ["9:30 AM","Exam",[["Examine a patient and ask about symptoms","care"],["Figure out what is wrong","fix"],["Explain the diagnosis clearly","people"]]],
 ["1:00 PM","Procedure",[["Stitch up a deep cut","hands"],["Order tests and prescribe medicine","plan"],["Decide quickly when it is urgent","rush"]]],
 ["4:00 PM","Wrap up",[["Write notes on every patient","write"],["Call a patient with results","people"],["Keep studying, because medicine changes","detail"]]]],
 skills:["Strong science","Listening","Decision-making","Lifelong studying"],
 steps:["Take biology, chemistry and the hardest math you can.","Apply to colleges and plan a science-heavy schedule. Fill out the FAFSA.","During college, get patient-care hours (EMT and nursing assistant jobs count), then apply to PA programs."],
 apply:"PA programs are competitive and expect real patient-care experience before you apply."},
{id:"vet",name:"Veterinary technician",pay:47000,yr:2025,paths:["short"],pathText:"Associate degree in veterinary technology, then a credential exam.",env:["hands","people","move"],set:"vet",shirt:"#4E8A6B",
 blurb:"You are the nurse of the animal hospital. You help the veterinarian with exams, lab work and surgery.",
 day:[["7:30 AM","Morning rounds",[["Feed and check animals that stayed overnight","animal"],["Set up the exam rooms","plan"],["Be on your feet all day","move"]]],
 ["9:00 AM","Exams",[["Hold a nervous dog still for the vet","animal"],["Draw blood and run lab tests","detail"],["Talk an owner through care at home","people"]]],
 ["12:30 PM","Surgery",[["Prepare an animal for surgery","detail"],["Watch its breathing and heart rate","care"],["Help the vet in an emergency","rush"]]],
 ["3:30 PM","Afternoon",[["Take X-rays of a limping cat","tech"],["Clean cages and tools","hands"],["Comfort an owner on a very sad day","people"]]]],
 skills:["Calm with animals","Biology","Careful lab work","Kindness with owners"],
 steps:["Take biology. Volunteer at an animal shelter or a vet's office.","Apply to accredited veterinary technology programs.","Finish the degree and pass the credential exam."],
 apply:"Honest note: the pay is low. Veterinarians typically earn about $130,000, and that path takes about 8 years of college."},
{id:"web",name:"Web and digital designer",pay:100000,yr:2025,paths:["college"],pathText:"Often a bachelor's degree. A strong portfolio of real work matters a lot.",env:["desk"],set:"office",shirt:"#C2587A",
 blurb:"You design and build websites and apps that are easy to use. It mixes art with code.",
 day:[["9:00 AM","Kickoff",[["Meet the team about a new website","team"],["Sketch how each page should work","plan"],["Sit at a screen most of the day","desk"]]],
 ["10:30 AM","Build",[["Write code that makes the page work","tech"],["Choose layout, color and type","detail"],["Test it on a phone and a laptop","fix"]]],
 ["2:00 PM","Feedback",[["Watch a real person try your site and get lost","people"],["Fix what tripped them up","fix"],["Balance what looks good with what works","plan"]]],
 ["4:00 PM","Launch",[["Push the update live","rush"],["Write notes for the next developer","write"],["Often work from home","desk"]]]],
 skills:["Design sense","HTML, CSS and JavaScript","Listening to users","Attention to detail"],
 steps:["Take art and computer classes. Build a simple website with free tools.","Build a portfolio of 3 to 5 projects. Apply to design or computer programs.","Earn the degree or build your skills and portfolio, and look for internships."],
 apply:"If you like graphic design, look here too. The skills overlap and the pay is much higher."},
{id:"data",name:"Data scientist",pay:120000,yr:2025,paths:["college"],pathText:"Bachelor's degree in math, statistics or computer science. Many have a master's degree.",env:["desk"],set:"office",shirt:"#4A5FA5",
 blurb:"You dig through huge amounts of information to answer questions and predict what will happen next.",
 day:[["9:00 AM","The question",[["Get a question: why are customers leaving?","plan"],["Pull the data you need","tech"],["Work at a computer all day","desk"]]],
 ["10:30 AM","Clean up",[["Fix messy, missing data","detail"],["Write code to sort millions of rows","tech"],["Use statistics","math"]]],
 ["2:00 PM","Find it",[["Spot a pattern nobody noticed","fix"],["Build a model that predicts what happens next","math"],["Check that you are not fooling yourself","detail"]]],
 ["4:00 PM","Explain",[["Turn your findings into a clear chart","tech"],["Present to people who don't like math","people"],["Write up what the company should do","write"]]]],
 skills:["Statistics","Coding","Curiosity","Explaining clearly"],
 steps:["Take statistics and the most math you can. Try a free intro to Python.","Apply to colleges with statistics, math, data science or computer science. Fill out the FAFSA.","Earn the degree and do projects with real data. Consider a master's later."],
 apply:"A school project where you collected and analyzed real data is a good thing to write about on applications."},
{id:"hr",name:"Human resources specialist",pay:76000,yr:2025,paths:["college"],pathText:"Bachelor's degree in human resources, business or a related field.",env:["people","desk"],set:"office",shirt:"#9A6A3A",
 blurb:"You hire people, help them settle in, and sort out problems at work. You are the link between workers and the company.",
 day:[["8:30 AM","Applications",[["Read applications for an open job","detail"],["Schedule interviews","plan"],["Split your time between a desk and meetings","desk"]]],
 ["10:00 AM","Interview",[["Interview a job candidate","people"],["Decide who fits the team","lead"],["Call someone with a job offer","people"]]],
 ["1:30 PM","A problem",[["Listen to an employee with a complaint","care"],["Sort out a conflict fairly","fix"],["Keep private things private","detail"]]],
 ["3:30 PM","New hire",[["Welcome a new employee and explain benefits","people"],["Update employee records","tech"],["Write a job posting","write"]]]],
 skills:["Listening","Fairness","Organization","Clear writing"],
 steps:["Take business or psychology classes. Any job where you train or schedule others helps.","Apply to colleges with business or human resources programs. Fill out the FAFSA.","Earn the degree. Internships in an HR office are the usual way in."],
 apply:"You will also learn how hiring works from the inside, which helps in any career."},
{id:"fa",name:"Flight attendant",pay:64000,yr:2025,paths:["earn"],pathText:"High school diploma, then paid airline training of several weeks and FAA certification.",env:["people","travel","move"],set:"cabin",shirt:"#2E4A7A",
 blurb:"You keep airline passengers safe and comfortable. Your office is a plane, and you may wake up in a different country.",
 day:[["5:30 AM","Report for duty",[["Review the flight's safety plan with the crew","team"],["Check emergency equipment before boarding","detail"],["Start the day in one city and end it in another","travel"]]],
 ["8:00 AM","Boarding",[["Greet 180 passengers","people"],["Give the safety demonstration","lead"],["Be on your feet in a narrow aisle","move"]]],
 ["12:00 PM","In the air",[["Serve drinks and meals","people"],["Calm a passenger who is afraid of flying","care"],["Handle a medical emergency at 35,000 feet","rush"]]],
 ["6:00 PM","Landing abroad",[["Land in another country and stay overnight","world"],["Use a second language with passengers","world"],["Be away from home several nights a week","travel"]]]],
 skills:["Customer service","Staying calm","First aid","A second language helps"],
 steps:["Get a job serving customers. Keep studying a second language.","Check airline requirements: most want you to be 18 to 21, with a diploma and customer service experience.","Apply to airlines. If hired, you train for several weeks before your first flight."],
 apply:"Speaking a second language helps you get international routes. New flight attendants often get the least popular schedules."},
{id:"pilot",name:"Airline pilot",pay:232000,yr:2025,paths:["college"],wait:6,chip:"College plus flight training",pathText:"Flight training and FAA licenses, then 1,500 flight hours before airlines hire you. Most airline pilots have a bachelor's degree.",env:["travel"],set:"cockpit",sets:["hangar","cockpit","cockpit","cockpit"],shirt:"#F5F8FA",
 blurb:"You fly passengers or cargo across the country and around the world. It is one of the highest-paid jobs you can get without a graduate degree.",
 day:[["6:00 AM","Preflight",[["Check the weather and the flight plan","plan"],["Walk around the plane to inspect it","detail"],["Brief the crew","lead"]]],
 ["8:00 AM","Takeoff",[["Take off with 180 people on board","rush"],["Work the controls and instruments","tech"],["Talk with air traffic control","team"]]],
 ["11:00 AM","Cruise",[["Monitor the plane's systems for hours","detail"],["Reroute around a storm","fix"],["Sit in a small cockpit for a long time","desk"]]],
 ["3:00 PM","Landing",[["Land in another country","world"],["Stay in hotels away from home","travel"],["Work an irregular schedule","rush"]]]],
 skills:["Math and physics","Calm decision-making","Attention to detail","Good health and vision"],
 steps:["Take physics and math. Ask a local airport about a discovery flight to see if you love it.","Compare routes: college aviation programs, flight schools, airline cadet programs, or military flying.","Earn your licenses step by step, then build flight hours, often as a flight instructor."],
 apply:"Flight training is expensive, so ask every program about cost and aid. Commercial pilots who fly charters, cargo and tours typically earn about $123,000."},
{id:"ship",name:"Ship's officer",pay:72000,yr:2025,paths:["earn","college"],pathText:"Start as a deckhand with Coast Guard credentials and work up, or attend a 4-year maritime academy.",env:["out","travel","move"],set:"ship",hat:"#FFFFFF",shirt:"#22384A",
 blurb:"You help run cargo ships, ferries or tugboats. On ocean-going ships you work for weeks at sea, then get weeks off.",
 day:[["6:00 AM","On watch",[["Stand watch on the bridge of a cargo ship","detail"],["Steer by radar, charts and GPS","tech"],["Be out on open water","out"]]],
 ["10:00 AM","Deck work",[["Inspect cargo and lines on deck","move"],["Repair equipment with the crew","hands"],["Work in wind, sun and rain","out"]]],
 ["2:00 PM","Foreign port",[["Guide the ship into a port in another country","world"],["Work with dock crews who speak other languages","world"],["Supervise loading thousands of containers","lead"]]],
 ["8:00 PM","Life aboard",[["Live on the ship for weeks or months","travel"],["Then get weeks off at home","plan"],["Run safety drills with the crew","team"]]]],
 skills:["Navigation","Mechanical sense","Teamwork in close quarters","Being okay away from home"],
 steps:["Take math and physics. Learn to swim well. Look into Sea Scouts or a maritime high school program.","Compare the two routes: a state or federal maritime academy, or entry-level deck jobs.","Get your Coast Guard credentials and start building sea time."],
 apply:"The pay figure covers all water transportation workers. Captains and officers on large ships earn much more."},
{id:"interp",name:"Interpreter or translator",pay:60000,yr:2025,paths:["college"],pathText:"Fluency in two languages. A bachelor's degree is typical, and certification helps for medical and court work.",env:["people","desk"],set:"office",sets:["office","clinic","class","office"],shirt:"#A0527A",
 blurb:"You help people who speak different languages understand each other, in writing or out loud, in hospitals, courts, schools and businesses.",
 day:[["8:30 AM","Translate",[["Translate a document from Spanish into English","world"],["Find the exact word, not just a close one","detail"],["Work at a computer with translation software","tech"]]],
 ["10:30 AM","At a hospital",[["Interpret between a doctor and a patient's family","care"],["Switch between two languages in real time","world"],["Stay neutral and accurate","detail"]]],
 ["1:30 PM","At a school",[["Interpret at a parent-teacher meeting","people"],["Think fast with no time to look anything up","rush"],["Drive to a different place for each job","travel"]]],
 ["4:00 PM","Prepare",[["Study the terms for tomorrow's job","plan"],["If you freelance, find your own clients","people"],["Write up an invoice","write"]]]],
 skills:["Two languages at a high level","Listening","Cultural knowledge","Fast thinking"],
 steps:["Keep building both languages, including reading and writing. Take the highest language classes you can.","Apply to colleges. Any major works if your languages are strong. Ask about a seal of biliteracy on your diploma.","Earn the degree and look into medical or court interpreter certification."],
 apply:"If you speak another language at home, you have a head start. Honest note: job growth is slow because software now does routine translation. Medical and court interpreting still need people."},
{id:"surv",name:"Land surveyor",pay:75000,yr:2025,paths:["college"],pathText:"Bachelor's degree, then a state license after supervised work experience.",env:["out","move","travel"],set:"field",prop:"tripod",hat:"#F4B321",shirt:"#D9822B",
 blurb:"You measure land to mark exactly where property lines, roads and buildings go. Nothing gets built until a surveyor has been there.",
 day:[["7:00 AM","Research",[["Study old property records and maps","detail"],["Load GPS gear into the truck","move"],["Drive to today's site","travel"]]],
 ["9:00 AM","In the field",[["Set up a tripod and measure the land","tech"],["Hike over rough ground","out"],["Mark the exact property corners","detail"]]],
 ["1:00 PM","Drone flight",[["Fly a drone to map a construction site","tech"],["Do the trigonometry","math"],["Work with a small crew","team"]]],
 ["3:30 PM","Back at the office",[["Turn your measurements into a map on a computer","desk"],["Sign a legal document saying where the line is","write"],["Explain a boundary to two neighbors","people"]]]],
 skills:["Geometry and trigonometry","Precision","Comfort outdoors","Mapping software"],
 steps:["Take geometry, trigonometry and any drafting or computer mapping class.","Apply to colleges with surveying, geomatics or civil engineering programs.","Earn the degree, work under a licensed surveyor, then take the licensing exams."],
 apply:"Many surveyors are close to retiring, and few students know the job exists."},
{id:"cost",name:"Cost estimator",pay:79000,yr:2025,paths:["college"],pathText:"Bachelor's degree is typical. Some estimators move up from the construction trades.",env:["desk"],set:"office",sets:["office","site","office","office"],hat:"#FFFFFF",shirt:"#52708F",
 blurb:"You work out what a project will cost before anyone builds it. If your number is right, your company wins the job and makes money.",
 day:[["8:30 AM","Blueprints",[["Study the blueprints for a new school","detail"],["Count every wall, window and pipe","detail"],["Work at a desk with big screens","desk"]]],
 ["10:30 AM","Site visit",[["Visit the site to see what could raise the cost","out"],["Ask builders how long each step takes","people"],["Spot a problem nobody priced in","fix"]]],
 ["1:30 PM","Pricing",[["Price the materials and labor","math"],["Call suppliers for quotes","people"],["Use estimating software","tech"]]],
 ["4:00 PM","The bid",[["Hand in the bid before the deadline","rush"],["Explain your number to the boss","people"],["Plan how to do it better next time","plan"]]]],
 skills:["Math","Reading blueprints","Attention to detail","Spreadsheets"],
 steps:["Take math and any drafting, construction or business class.","Apply to construction management, engineering or business programs.","Earn the degree or start in a trade, then train as a junior estimator."],
 apply:"Estimators work in manufacturing too, pricing products before they are made."},
{id:"rad",name:"Radiation therapist",pay:105000,yr:2025,paths:["short"],pathText:"Associate degree in radiation therapy, then certification and usually a state license.",env:["people","desk"],set:"scan",shirt:"#3B8E72",
 blurb:"You give radiation treatments to people with cancer. You see the same patients every day for weeks and get to know them.",
 day:[["8:00 AM","Machine check",[["Check and warm up the treatment machine","detail"],["Review each patient's treatment plan","plan"],["Work in one treatment room most of the day","desk"]]],
 ["9:30 AM","First patient",[["Position a patient to the millimeter","detail"],["Explain what will happen and answer questions","people"],["Help a weak patient onto the table","care"]]],
 ["12:30 PM","Treatment",[["Run the machine from a control room","tech"],["Watch the patient on a monitor the whole time","care"],["Follow strict radiation safety rules","detail"]]],
 ["3:00 PM","Afternoon",[["Greet patients you have seen every day for weeks","people"],["Be there on someone's last day of treatment","care"],["Record every dose","write"]]]],
 skills:["Precision","Compassion","Physics and anatomy","Emotional steadiness"],
 steps:["Take biology, physics and algebra. Volunteer at a hospital.","Apply to accredited radiation therapy programs. There are not many, so look early.","Finish the degree and clinical hours, then pass the certification exam."],
 apply:"This is one of the best-paid jobs you can get with a two-year degree."},
{id:"ota",name:"Occupational therapy assistant",pay:71000,yr:2025,paths:["short"],pathText:"Associate degree from an accredited program, then a license.",env:["people","move","hands"],set:"gym",shirt:"#C06A3A",
 blurb:"You help people relearn everyday tasks after an injury or illness, and help kids build skills for school.",
 day:[["8:00 AM","Plan the day",[["Go over today's patients with the occupational therapist","team"],["Set up equipment and activities","plan"],["Be on your feet and moving","move"]]],
 ["9:30 AM","Rehab",[["Help a stroke survivor practice getting dressed","care"],["Teach someone to cook with one hand","hands"],["Cheer on small wins","lead"]]],
 ["1:00 PM","School visit",[["Work with a child on handwriting and focus","care"],["Turn therapy into a game","plan"],["Talk with the teacher and parents","people"]]],
 ["3:30 PM","Wrap up",[["Record each patient's progress","write"],["Change an activity that is too hard","fix"],["Drive between clinics or schools","travel"]]]],
 skills:["Patience","Creativity","Anatomy","Encouraging people"],
 steps:["Take biology and psychology. Volunteer with kids or older adults.","Apply to accredited occupational therapy assistant programs at community colleges.","Finish the degree and fieldwork, then pass the national exam."],
 apply:"The pay figure includes aides, who earn less. Assistants with the degree and license typically earn more."},
{id:"ipm",name:"Factory production manager",pay:126000,yr:2025,paths:["college","earn"],pathText:"Bachelor's degree is typical. Some start on the factory floor and move up.",env:["move","people"],set:"warehouse",hat:"#FFFFFF",shirt:"#4B5F7A",
 blurb:"You run a factory or part of one. You make sure products are made on time, safely and at the right quality.",
 day:[["6:30 AM","Shift change",[["Walk the factory floor","move"],["Check last night's output numbers","math"],["Lead the morning meeting","lead"]]],
 ["9:00 AM","Machine down",[["Decide what to do while a line is stopped","rush"],["Work with mechanics to get it running","fix"],["Reschedule orders","plan"]]],
 ["1:00 PM","Improve",[["Review quality reports","detail"],["Find a way to cut waste","fix"],["Meet with engineers about a new product","team"]]],
 ["3:30 PM","People",[["Hire and train a new supervisor","people"],["Report to company leaders","write"],["Keep everyone safe","lead"]]]],
 skills:["Leading people","Problem-solving","Comfort with numbers","Staying organized"],
 steps:["Take math and business classes. A summer job in a plant or warehouse teaches a lot.","Choose a route: business or industrial engineering in college, or an entry job in manufacturing.","Earn the degree or work up from operator to supervisor to manager."],
 apply:"In the Gallup-Amazon data, about half of these managers do not have a bachelor's degree."},
{id:"forest",name:"Forester",pay:74000,yr:2025,paths:["college"],pathText:"Bachelor's degree in forestry or natural resources.",env:["out","move","travel"],set:"field",prop:"trees",hat:"#F4B321",shirt:"#3E7C59",
 blurb:"You take care of forests: which trees to cut, where to replant, and how to prevent wildfires. Much of the job is outside.",
 day:[["7:00 AM","Into the woods",[["Drive a truck deep into the forest","travel"],["Hike to today's stand of trees","out"],["Carry measuring tools and a GPS","move"]]],
 ["9:00 AM","Tree check",[["Measure trees and check their health","detail"],["Spot signs of insects or disease","fix"],["Work alone in quiet woods","out"]]],
 ["1:00 PM","Planning",[["Decide which trees to cut and where to replant","plan"],["Plan a controlled burn to prevent wildfires","rush"],["Meet a landowner or logging crew","people"]]],
 ["3:30 PM","Write it up",[["Map your findings on a computer","tech"],["Write a forest management plan","write"],["Watch for wildlife as you work","animal"]]]],
 skills:["Biology and ecology","Fitness","Mapping software","Working alone"],
 steps:["Take biology and environmental science. Spend time outdoors: hiking, scouts, trail work.","Apply to colleges with forestry or natural resources programs.","Earn the degree. Summer jobs with state or national forests help you get hired."],
 apply:"Conservation scientists do similar work on rangeland and farms. Most jobs are in rural areas."},
{id:"land",name:"Landscape architect",pay:80000,yr:2025,paths:["college"],pathText:"Bachelor's degree in landscape architecture, then a state license.",env:["out","desk"],set:"office",sets:["office","field","office","field"],shirt:"#6B7F3A",
 blurb:"You design parks, campuses, playgrounds and gardens. You decide where the paths, trees and water go.",
 day:[["9:00 AM","New project",[["Meet with a city about a new park","people"],["Sketch paths, trees and a playground","plan"],["Design on a computer","tech"]]],
 ["11:00 AM","Site walk",[["Walk the land to see slopes, sun and water","out"],["Measure and take photos","detail"],["Choose plants that will survive there","fix"]]],
 ["2:00 PM","The details",[["Work out drainage so the park doesn't flood","math"],["Estimate what it will cost","math"],["Sit at a desk for the detailed drawings","desk"]]],
 ["4:00 PM","Under construction",[["Visit a park being built from your design","out"],["Fix a problem with the construction crew","team"],["Present to the neighborhood","people"]]]],
 skills:["Drawing and design","Plant knowledge","Geometry","Presenting ideas"],
 steps:["Take art, biology and geometry. Notice how parks and public spaces near you are laid out.","Apply to colleges with accredited landscape architecture programs. Some ask for a portfolio.","Earn the degree, work under a licensed landscape architect, then take the licensing exam."],
 apply:"If you like both art and the outdoors, this is a rare job that uses both."},
{id:"farm",name:"Farm or ranch manager",pay:90000,yr:2025,paths:["earn","college"],pathText:"Usually learned by working on a farm. Many also study agriculture in college.",env:["out","hands","move"],set:"field",prop:"barn",hat:"#D9A766",shirt:"#35618F",
 blurb:"You run a farm or ranch: crops, animals, equipment, workers and money. You are outside in every season.",
 day:[["5:30 AM","Sunrise",[["Feed and check the cattle","animal"],["Work outside in every kind of weather","out"],["Start before most people wake up","move"]]],

function overlapTraits(c,w){return Object.keys(w).filter(function(t){return w[t]>0&&c.traits[t];}).sort(function(a,b){return (c.traits[b]||0)-(c.traits[a]||0);});}
/* Child matching */
function childWeights(){var g=G(),w={};g.str.forEach(function(t){w[t]=(w[t]||0)+2;});g.acts.forEach(function(id){var a=ACTS.filter(function(x){return x[0]===id;})[0];if(a)a[2].forEach(function(t){w[t]=(w[t]||0)+1;});});return w;}
function childScore(c){var g=G(),w=childWeights(),s=0;
 g.hope.forEach(function(h){if(h==="pay")s+=Math.min(c.pay,140000)/40000;else if(h==="short"){if(noDegree(c))s+=3;}else s+=Math.min(c.traits[h]||0,3)*0.9+(c.env.indexOf(h)>-1?1:0);});
 g.genv.forEach(function(e){if(c.env.indexOf(e)>-1)s+=2;});
 Object.keys(w).forEach(function(t){s+=w[t]*Math.min(c.traits[t]||0,3)*0.5;});
 g.acts.forEach(function(id){var a=ACTS.filter(function(x){return x[0]===id;})[0];if(a&&a[3]&&a[3].indexOf(c.id)>-1)s+=2;});
 return s;}
function childRanked(){return CAREERS.slice().sort(function(a,b){return childScore(b)-childScore(a)||b.pay-a.pay;});}
function childWhy(c){var g=G(),w=childWeights(),r=[];g.hope.forEach(function(h){if(h==="pay"&&c.pay>=80000)r.push("pays well");if(h==="short"&&noDegree(c))r.push("no 4-year degree needed");});
 g.genv.forEach(function(e){if(c.env.indexOf(e)>-1)r.push(TRAITS[e].toLowerCase());});
 overlapTraits(c,w).slice(0,3).forEach(function(t){var n=TRAITS[t].toLowerCase();if(r.indexOf(n)<0)r.push(n);});return r.slice(0,4);}
/* Adult matching */
function meScore(c){var g=G(),s=0,w=meLikeTraits();
 Object.keys(w).forEach(function(t){s+=w[t]*Math.min(c.traits[t]||0,3)*0.7;});
 g.env.forEach(function(e){if(c.env.indexOf(e)>-1)s+=2;});
 var max=g.time==null?99:+g.time;if(c.wait>max)s-=3;
 var cur=g.jobId?BY[g.jobId]:null;
 if(g.goal==="up"&&cur){if(catOf(c.id)===catOf(cur.id))s+=3;if(c.pay>cur.pay)s+=2;}
 if(g.goal==="re"&&cur&&catOf(c.id)!==catOf(cur.id))s+=2;
 if(g.goal==="ret"&&c.wait<=2)s+=2;
 return s+c.pay/100000;}
function meRanked(){var g=G();return CAREERS.filter(function(c){return c.id!==g.jobId;}).sort(function(a,b){return meScore(b)-meScore(a);});}
function timeNote(c){var g=G(),max=g.time==null?99:+g.time;if(c.wait===0)return "You would be paid while you train.";if(c.wait<=max)return "Fits your time: about "+c.wait+" years of training.";return "Takes about "+c.wait+" years of training, longer than you said you have. Part-time programs can spread it out.";}

 return '<button class="brand" data-act="g_home" aria-label="Try a Day for parents and guardians, back to start"><i></i>Try a Day</button><button class="ghost" data-act="g_student">Student view</button>'+(g.who?'<button class="ghost" data-act="g_report">'+(g.who==="me"?"My plan":(g.kids.length>1?"My lists":"My list"))+'</button>':'')+'<button class="ghost calm" data-act="overwhelm">I\'m overwhelmed</button><div class="modebar"><span>'+esc(lbl)+'</span>'+(g.who==="child"?'<button class="link" data-act="g_another">Another child</button>':'')+(g.who?'<button class="link" data-act="g_home">Switch</button>':'')+'</div>';}
function render(scroll){document.getElementById("hdr").innerHTML=header();
 var md=S.mode!=="guardian"?null:(G().who==="me"?"me":"guard");try{if(md)document.documentElement.setAttribute("data-mode",md);else document.documentElement.removeAttribute("data-mode");}catch(x){}
document.getElementById("main").innerHTML='<div class="fade" style="display:flex;flex-direction:column;gap:18px">'+view()+'</div>';
 document.getElementById("sheet").innerHTML=S.sheet?vSheet():(S.mode==="guardian"&&G().kidSheet?vKids():"");
 if(!S.sheet&&S.mode==="guardian"&&G().kidSheet){var ki=[].slice.call(document.querySelectorAll(".kidname"));var em=ki.filter(function(x){return !x.value;})[0]||ki[0];if(em)em.focus();}
 if(S.sheet){var b=document.querySelector(".sheet .opt");if(b)b.focus();}
 if(scroll==="top")window.scrollTo(0,0);
 var sc=document.getElementById("scene");if(sc){var x0=null;sc.addEventListener("touchstart",function(e){x0=e.touches[0].clientX;},{passive:true});sc.addEventListener("touchend",function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50){act(dx<0?"next":"prev");render("stay");}x0=null;});}}
function boot(saved){if(saved&&saved.view){var f=fresh();Object.keys(f).forEach(function(k){if(saved[k]!==undefined)f[k]=saved[k];});if(saved.g){var gf=gFresh();Object.keys(gf).forEach(function(k){if(saved.g[k]!==undefined)gf[k]=saved.g[k];});f.g=gf;}S=f;S.sheet=false;}
 document.addEventListener("click",function(e){var j=e.target.closest("a[data-jump]");if(j){e.preventDefault();var el=document.getElementById(j.getAttribute("data-jump"));if(el){var rm=false;try{rm=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(x){}el.scrollIntoView({behavior:rm?"auto":"smooth",block:"start"});try{el.focus({preventScroll:true});}catch(x){}}return;}var t=e.target.closest("[data-act]");if(!t||t.tagName==="SELECT")return;
  if(t.classList.contains("sheet")&&e.target!==t)return;
  var a=t.getAttribute("data-act");
  if(a==="g_kidadd")G().kidDraft=[].slice.call(document.querySelectorAll(".kidname")).map(function(x){return x.value;});
  if(a==="copy"){var GMc=S.mode==="guardian";var txt=GMc?gReportText():reportText();var done=function(){if(GMc)G().copied=true;else S.copied=true;render("stay");};try{navigator.clipboard.writeText(txt).then(done,function(){var r=document.getElementById("rt");if(r){r.focus();r.select();}});}catch(err){var r2=document.getElementById("rt");if(r2){r2.focus();r2.select();}}return;}
  render(act(a,t.getAttribute("data-v"),t.getAttribute("data-s")));});
 document.addEventListener("submit",function(e){var f=e.target;if(!f||!f.id)return;e.preventDefault();if(f.id==="gsearch"){act("g_search",(document.getElementById("gq")||{}).value);render("stay");var r=document.querySelector("main .job");if(r)r.scrollIntoView({block:"nearest"});}else if(f.id==="gkids"){render(act("g_kidsave",[].slice.call(document.querySelectorAll(".kidname")).map(function(x){return x.value;})));}else if(f.id==="gjob"){act("g_jobsearch",(document.getElementById("gjq")||{}).value);render("stay");}});
 document.addEventListener("change",function(e){if(e.target.id==="startsel"){act("startsel",e.target.value);render("stay");}});
 document.addEventListener("keydown",function(e){if(e.key==="Escape"&&S.sheet){S.sheet=false;render("stay");}
  else if(e.key==="Escape"&&S.mode==="guardian"&&G().kidSheet){G().kidSheet=false;render("stay");}
  else if(S.view==="day"&&!S.sheet&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){act(e.key==="ArrowRight"?"next":"prev");render("stay");}});
 render("stay");}
if(typeof document!=="undefined"){
 var hot=window.claude&&window.claude.hot;
 if(hot&&hot.snapshot)hot.snapshot(function(){return S;});
 if(hot&&hot.ready)hot.ready(boot);else boot(hot&&hot.data?hot.data:{});
}
</script>
</body>
